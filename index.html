<html lang="en">
<head>
<meta charset="UTF-8">

<title>Vynix Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#18252b;--muted:#63747a;--paper:#f4f7f2;--white:#fff;--line:#dce5df;--teal:#0c6b68;--teal-dark:#084c4b;--coral:#ed7658;--yellow:#f2c66d;--shadow:0 18px 50px rgba(24,37,43,.09);--body:"DM Sans",sans-serif;--display:Manrope,sans-serif;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:var(--body);color:var(--ink)}body{background:var(--paper);background-image:linear-gradient(135deg,rgba(12,107,104,.06),transparent 42%),radial-gradient(circle at 90% 5%,rgba(237,118,88,.12),transparent 25%)}button,input{font:inherit}button{cursor:pointer}a{color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.rail{background:var(--teal-dark);color:#e8f5ee;padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:800;font-size:17px;padding:0 12px 32px}.mark{width:31px;height:31px;border-radius:10px;background:var(--coral);display:grid;place-items:center;color:#fff;font-weight:800}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#a9cfca;text-align:left;padding:12px;border-radius:9px;font-size:14px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.1);color:#fff}.rail-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:18px 12px;color:#91b9b4;font-size:12px;line-height:1.5}.main{max-width:1180px;width:100%;margin:0 auto;padding:42px 48px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:34px}.eyebrow{color:var(--teal);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}.title{font:800 32px var(--display);letter-spacing:-.03em;margin:0}.subtitle{color:var(--muted);margin:8px 0 0;font-size:15px}.userbar{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:700}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:600;font-size:13px}.primary{background:var(--coral);color:#fff;box-shadow:0 7px 18px rgba(237,118,88,.24)}.primary:hover{background:#d96145}.secondary{background:var(--white);border:1px solid var(--line);color:var(--ink)}.secondary:hover{border-color:var(--teal)}.overview{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:12px;margin-bottom:30px}.metric,.welcome{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:19px}.welcome{background:var(--teal);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}.welcome strong{font:700 18px var(--display)}.welcome small{color:#b9ded5}.metric-label{color:var(--muted);font-size:12px}.metric-value{font:700 26px var(--display);margin-top:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.section-head h2{font:700 18px var(--display);margin:0}.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.project{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:var(--shadow);min-height:145px;display:flex;flex-direction:column}.project-top{display:flex;justify-content:space-between;gap:12px}.project h3{font:700 16px var(--display);margin:0}.project p{color:var(--muted);font-size:13px;margin:8px 0}.project-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.tag{color:var(--teal);background:#e0f1ec;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700}.empty{border:1px dashed #bdcec6;border-radius:13px;padding:48px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font:700 17px var(--display);margin-bottom:7px}.studio{display:grid;grid-template-columns:190px 1fr;gap:35px}.studio-nav{border-right:1px solid var(--line);padding-right:18px}.studio-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:8px;color:var(--muted);font-size:13px}.studio-nav button.active,.studio-nav button:hover{background:#e0f1ec;color:var(--teal);font-weight:600}.panel{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:24px;box-shadow:var(--shadow)}.panel h2{font:700 21px var(--display);margin:0 0 5px}.panel p{color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.field input{width:100%;border:1px solid var(--line);border-radius:7px;background:#fbfdfb;padding:10px;color:var(--ink);outline:0}.field input:focus{border-color:var(--teal)}.field.full{grid-column:1/-1}.notice{padding:13px 15px;border-radius:9px;background:#fff6df;color:#775d27;font-size:13px;margin-top:17px}.lock{border:1px solid #f0dfb5;background:#fffaf0;border-radius:10px;padding:17px;margin-top:18px}.lock strong{display:block;color:#755821;margin-bottom:4px}.build-card{border-top:1px solid var(--line);padding:17px 0}.build-card:first-of-type{border-top:0}.build-card h3{font:700 15px var(--display);margin:0}.build-card p{margin:5px 0 12px}.error{max-width:540px;margin:12vh auto;background:var(--white);border:1px solid var(--line);border-radius:15px;padding:35px;text-align:center;box-shadow:var(--shadow)}.error h1{font:700 25px var(--display);margin:0 0 8px}.error p{color:var(--muted);font-size:14px;line-height:1.5}.error code{font-family:var(--mono);font-size:12px;background:#eef4f0;padding:3px 6px;border-radius:4px}.modal-back{position:fixed;inset:0;background:rgba(8,76,75,.3);display:grid;place-items:center;padding:20px}.modal{width:min(480px,100%);background:var(--white);border-radius:14px;padding:25px;box-shadow:0 25px 80px rgba(24,37,43,.22)}.modal h2{font:700 20px var(--display);margin:0 0 18px}.modal-close{float:right;border:0;background:none;font-size:20px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

;grid-template-columns:1.4fr repeat(3,1fr);gap:12px;margin-bottom:30px}.metric,.welcome{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:19px}.welcome{background:var(--teal);color:#041412;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}.welcome strong{font:700 18px var(--display)}.welcome small{color:#063c36}.metric-label{color:var(--muted);font-size:12px}.metric-value{font:700 26px var(--display);margin-top:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.section-head h2{font:700 18px var(--display);margin:0}.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.project{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:var(--shadow);min-height:145px;display:flex;flex-direction:column}.project-top{display:flex;justify-content:space-between;gap:12px}.project h3{font:700 16px var(--display);margin:0}.project p{color:var(--muted);font-size:13px;margin:8px 0}.project-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.tag{color:var(--teal);background:#123c36;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700}.empty{border:1px dashed #31534c;border-radius:13px;padding:48px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font:700 17px var(--display);margin-bottom:7px}.studio{display:grid;grid-template-columns:190px 1fr;gap:35px}.studio-nav{border-right:1px solid var(--line);padding-right:18px}.studio-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:8px;color:var(--muted);font-size:13px}.studio-nav button.active,.studio-nav button:hover{background:#123c36;color:var(--teal);font-weight:600}.panel{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:24px;box-shadow:var(--shadow)}.panel h2{font:700 21px var(--display);margin:0 0 5px}.panel p{color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.field input{width:100%;border:1px solid var(--line);border-radius:7px;background:#0b1c19;padding:10px;color:var(--ink);outline:0}.field input:focus{border-color:var(--teal)}.field.full{grid-column:1/-1}.notice{padding:13px 15px;border-radius:9px;background:#3b3018;color:#f0cf83;font-size:13px;margin-top:17px}.lock{border:1px solid #5a4a26;background:#292318;border-radius:10px;padding:17px;margin-top:18px}.lock strong{display:block;color:#f0cf83;margin-bottom:4px}.build-card{border-top:1px solid var(--line);padding:17px 0}.build-card:first-of-type{border-top:0}.build-card h3{font:700 15px var(--display);margin:0}.build-card p{margin:5px 0 12px}.error{max-width:540px;margin:12vh auto;background:var(--white);border:1px solid var(--line);border-radius:15px;padding:35px;text-align:center;box-shadow:var(--shadow)}.error h1{font:700 25px var(--display);margin:0 0 8px}.error p{color:var(--muted);font-size:14px;line-height:1.5}.error code{font-family:var(--mono);font-size:12px;background:#19332e;padding:3px 6px;border-radius:4px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:20px}.modal{width:min(480px,100%);background:var(--white);border-radius:14px;padding:25px;box-shadow:0 25px 80px rgba(0,0,0,.5)}.modal h2{font:700 20px var(--display);margin:0 0 18px}.modal-close{float:right;border:0;background:none;font-size:20px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

</style>

<body><div id="app"></div>
<script>
const app=document.getElementById('app');
let currentUser=null,projects=[],route='home',studioProjectId=null,studioTab='identity',modal=false,authMode='login',authBusy=false,authError='';
const DB=window.DB={projects};
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const response=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let body=null;try{body=await response.json()}catch(_e){}if(!response.ok){const error=new Error((body&&(body.message||body.error))||'Unexpected status '+response.status);error.status=response.status;throw error}return body}
function setState(patch){if(patch.route!==undefined)route=patch.route;if(patch.studioProjectId!==undefined)studioProjectId=patch.studioProjectId;if(patch.studioTab!==undefined){studioTab=patch.studioTab;window.studioTab=studioTab}render()}
window.setState=setState;
function initials(name){return(name||'?').slice(0,1).toUpperCase()}
function layout(content){return '<div class="shell"><aside class="rail"><div class="brand"><span class="mark">V</span>Vynix Forge</div><nav class="nav"><button class="'+(route==='home'?'active':'')+'" onclick="goHome()">Overview</button><button class="'+(route==='studio'?'active':'')+'" onclick="openFirst()">Launcher studio</button><button onclick="showSettings()">Workspace settings</button></nav><div class="rail-foot">Build beautiful Minecraft launchers.<br>Ship with confidence.</div></aside><main class="main">'+content+'</main></div>'}
function render(){if(currentUser===null){app.innerHTML='<div class="error"><p>Connecting to Vynix Forge...</p></div>';return}if(currentUser===false){app.innerHTML=renderAuth();return}if(currentUser.error){app.innerHTML='<div class="error"><h1>Backend unavailable</h1><p>'+esc(currentUser.error)+'</p><p>Open this page through the Node server at <code>http://localhost:3000</code>, not a static file preview.</p><button class="btn primary" onclick="refreshCurrentUser()">Retry connection</button></div>';return}if(route==='studio'){renderStudio();return}app.innerHTML=layout(renderHome());if(modal)app.insertAdjacentHTML('beforeend',modalMarkup())}
function renderAuth(){const register=authMode==='register',title=register?'Create your workspace':'Welcome back',description=register?'Build and ship a launcher from one focused workspace.':'Sign in to continue to your launcher workspace.';return '<div class="error" style="max-width:460px;text-align:left"><div class="brand" style="padding:0 0 25px"><span class="mark">V</span>Vynix Forge</div><h1>'+title+'</h1><p>'+description+'</p>'+(authError?'<div class="notice" style="background:#fff0eb;color:#a44831">'+esc(authError)+'</div>':'')+'<form onsubmit="submitAuth(event)" style="display:grid;gap:14px;margin-top:20px">'+(register?'<div class="field"><label for="authName">Display name</label><input id="authName" autocomplete="name" required></div>':'')+'<div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" required></div><div class="field"><label for="authPassword">Password</label><div style="display:flex;gap:8px"><input id="authPassword" type="password" autocomplete="'+(register?'new-password':'current-password')+'" minlength="8" required><button class="btn secondary show-pass" type="button" onclick="togglePassword()">Show</button></div>'+(register?'<small id="strengthText" class="metric-label">Use at least 8 characters.</small>':'')+'</div><label class="metric-label"><input id="remember" type="checkbox"> Remember me for 30 days</label><button class="btn primary" type="submit">'+(authBusy?'Working...':register?'Create account':'Sign in')+'</button></form><a class="btn secondary" href="/auth/github/login" style="display:block;text-align:center;text-decoration:none;margin-top:12px">Sign in with GitHub</a><div style="display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:13px"><button class="btn secondary" type="button" onclick="authMode=\''+(register?'login':'register')+'\';authError=\'\';render()">'+(register?'Already have an account? Sign in':'Create an account')+'</button>'+(register?'':'<button class="btn secondary" type="button" onclick="forgotPassword()">Forgot password?</button>')+'</div></div>'}
function renderHome(){const name=esc(currentUser.githubLogin),active=projects.filter(p=>!p.archived),limit=currentUser.limits.maxActiveProjects===Infinity?'Unlimited':currentUser.limits.maxActiveProjects,plan=esc(currentUser.plan.slice(0,1).toUpperCase()+currentUser.plan.slice(1));return '<header class="top"><div><p class="eyebrow">Workspace / overview</p><h1 class="title">Good to see you, '+name+'</h1><p class="subtitle">Your launchers, builds, and release work in one place.</p></div><div class="userbar"><span class="avatar">'+initials(name)+'</span><span>'+plan+' plan</span><button class="btn secondary" onclick="logout()">Sign out</button></div></header><section class="overview"><div class="welcome"><strong>Make something players remember.</strong><small>Start with a launcher project and shape every detail.</small></div><div class="metric"><div class="metric-label">Plan</div><div class="metric-value">'+plan+'</div></div><div class="metric"><div class="metric-label">Active launchers</div><div class="metric-value">'+active.length+' / '+limit+'</div></div><div class="metric"><div class="metric-label">Builds today</div><div class="metric-value">'+currentUser.usage.buildsToday+'</div></div></section><div class="section-head"><h2>Your launchers</h2><button class="btn primary" onclick="modal=true;render()">+ New launcher</button></div><section class="projects">'+(active.length?active.map(projectCard).join(''):'<div class="empty"><strong>Your workspace is quiet.</strong>Create your first launcher to begin.</div>')+'</section>'}
function projectCard(project){return '<article class="project"><div class="project-top"><h3>'+esc(project.name)+'</h3><span class="tag">'+esc(project.config&&project.config.minecraft&&project.config.minecraft.loader||'vanilla')+'</span></div><p>'+esc(project.description||'A new Vynix Forge launcher project.')+'</p><div class="project-foot"><span>Updated recently</span><button class="btn secondary" onclick="openStudio(\''+esc(project.id)+'\')">Open studio</button></div></article>'}
function renderStudio(){const project=projects.find(p=>p.id===studioProjectId);if(!project){route='home';render();return}const config=project.config||{};app.innerHTML=layout('<header class="top"><div><p class="eyebrow">Launcher studio</p><h1 class="title">'+esc(project.name)+'</h1><p class="subtitle">Configure your player experience, then build a real artifact.</p></div><button class="btn secondary" onclick="goHome()">Back to overview</button></header><div class="studio"><nav class="studio-nav"><button class="active">Identity & build</button></nav><section class="panel">'+identityPanel(project,config)+buildPanel(project)+'</section></div>')}
function identityPanel(project,config){const identity=config.identity||{};return '<h2>Shape the identity</h2><p>The essentials players see first.</p><div class="form-grid"><div class="field"><label>Launcher name</label><input value="'+esc(identity.launcherName||project.name)+'" onchange="saveIdentity(\'launcherName\',this.value)"></div><div class="field"><label>Version</label><input value="'+esc(identity.version||'0.1.0')+'" onchange="saveIdentity(\'version\',this.value)"></div><div class="field full"><label>Description</label><input value="'+esc(project.description||'')+'" onchange="saveIdentity(\'description\',this.value)"></div></div><div class="notice">Changes save to the server as you make them.</div>'}
function buildPanel(project){const canCloud=['pro','dev','owner'].includes(currentUser.plan),canExe=['dev','owner'].includes(currentUser.plan);return '<h2>Build & release</h2><p>Turn your configuration into a downloadable launcher.</p><div class="build-card"><h3>Source package</h3><p>Generate a complete Electron project source archive.</p><button class="btn primary" onclick="buildSource()">Generate source package</button></div><div class="build-card"><h3>Cloud build</h3><p>Compile a Linux AppImage on the Forge build worker.</p>'+(canCloud?'<button class="btn primary" onclick="requestBuild(\'cloud\')">Request cloud build</button>':'<div class="lock"><strong>Cloud builds requires Pro.</strong>Upgrade your plan to compile launchers on Forge infrastructure.</div>')+'</div><div class="build-card"><h3>Production Windows .exe</h3><p>Cross-compile a signed-ready Windows installer.</p>'+(canExe?'<button class="btn primary" onclick="requestBuild(\'production-exe\')">Request production .exe</button>':'<div class="lock"><strong>Production .exe builds requires Dev.</strong>Upgrade your plan to create Windows installers.</div>')+'</div>'}
async function refreshCurrentUser(){currentUser=null;render();try{currentUser=await api('/api/me');projects=await api('/api/projects');DB.projects=projects}catch(error){if(error.status===401)currentUser=false;else currentUser={error:error.message}}render()}
async function createProject(){const input=document.getElementById('npName'),name=input&&input.value.trim();if(!name)return;try{const project=await api('/api/projects',{method:'POST',body:JSON.stringify({name,config:{identity:{launcherName:name,version:'0.1.0'},minecraft:{loader:'vanilla'}}})});projects.unshift(project);DB.projects=projects;modal=false;openStudio(project.id)}catch(error){alert(error.message)}}
function modalMarkup(){return '<div class="modal-back"><div class="modal"><button class="modal-close" onclick="modal=false;render()">x</button><h2>New launcher</h2><div class="field"><label>Launcher name</label><input id="npName" autofocus placeholder="e.g. Emberlands" onkeydown="if(event.key===\'Enter\')createProject()"></div><div class="actions"><button class="btn secondary" onclick="modal=false;render()">Cancel</button><button class="btn primary" onclick="createProject()">Create launcher</button></div></div></div>'}
function openStudio(id){studioProjectId=id;studioTab='identity';route='studio';render()}function goHome(){route='home';render()}function openFirst(){if(projects[0])openStudio(projects[0].id);else{route='home';render();modal=true;render()}}function showSettings(){alert('Workspace settings are coming soon.')}function logout(){fetch('/auth/logout',{method:'POST',credentials:'include'}).finally(()=>{currentUser=false;projects=[];route='home';render()})}
 const baseRenderAuth=renderAuth;renderAuth=()=>baseRenderAuth().replace('</a><div style="display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:13px">','</a><a class="btn secondary" href="/auth/google/login" style="display:block;text-align:center;text-decoration:none;margin-top:8px">Sign in with Google</a><div style="display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:13px">');
function togglePassword(){const input=document.getElementById('authPassword'),button=document.querySelector('.show-pass');if(!input)return;input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'Show':'Hide'}
function updateStrength(){const input=document.getElementById('authPassword'),bar=document.getElementById('strengthBar'),text=document.getElementById('strengthText');if(!input||!bar)return;const value=input.value,score=(value.length>=8)+(value.length>=12)+(/[A-Z]/.test(value)?1:0)+(/[0-9]/.test(value)?1:0)+(/[^A-Za-z0-9]/.test(value)?1:0);bar.style.width=Math.min(100,score*20)+'%';bar.style.background=score<3?'var(--coral)':score<5?'var(--yellow)':'var(--teal)';if(text)text.textContent=score<3?'Add length, numbers, or symbols':score<5?'Good start':'Strong password'}
async function submitAuth(event){event.preventDefault();if(authBusy)return;authBusy=true;authError='';render();try{const register=authMode==='register',payload={email:document.getElementById('authEmail').value,password:document.getElementById('authPassword').value,remember:!!document.getElementById('remember')?.checked};if(register)payload.displayName=document.getElementById('authName').value;await api(register?'/auth/local/register':'/auth/local/login',{method:'POST',body:JSON.stringify(payload)});await refreshCurrentUser()}catch(error){authBusy=false;authError=error.message;render()}}
async function forgotPassword(){const email=document.getElementById('authEmail')?.value||'';if(!email){authError='Enter your email first.';render();return}try{await api('/auth/local/forgot-password',{method:'POST',body:JSON.stringify({email})})}catch(error){authError=error.message;render()}}
document.addEventListener('input',event=>{if(event.target.id==='authPassword'&&authMode==='register')updateStrength()});
async function saveIdentity(field,value){const project=projects.find(p=>p.id===studioProjectId);if(!project)return;project.config=project.config||{};project.config.identity=project.config.identity||{};if(field==='description')project.description=value;else project.config.identity[field]=value;try{await api('/api/projects/'+encodeURIComponent(project.id),{method:'PATCH',body:JSON.stringify({name:project.name,description:project.description||'',config:project.config})})}catch(error){alert(error.message)}}
async function buildSource(){try{const project=projects.find(p=>p.id===studioProjectId);const response=await fetch('/api/builds/source/'+encodeURIComponent(project.id),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:project.config||project,servers:[]})});if(!response.ok)throw new Error('Unexpected status '+response.status);const blob=await response.blob();const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='launcher-source.zip';link.click()}catch(error){alert(error.message)}}
async function requestBuild(kind){try{const project=projects.find(p=>p.id===studioProjectId);const body=await api('/api/builds/'+kind+'/'+encodeURIComponent(project.id),{method:'POST',body:JSON.stringify({project:project.config||project,servers:[]})});alert('Build queued: '+body.buildId)}catch(error){alert(error.message)}}
refreshCurrentUser();
</script></body></html>
