<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vynix Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131110; --panel:#1c1917; --panel-raised:#262220;
  --border:#362f2a; --border-soft:#2a2521;
  --text:#ede8e1; --dim:#a89e93; --faint:#6f665c;
  --ember:#c4632e; --ember-bright:#e07a3f; --ember-dim:#7a3f1f;
  --copper:#5b7065; --copper-bright:#7c9788;
  --danger:#b8503f; --warn:#c99a3f;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body,#app{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--ember-dim);color:var(--text);}
.h-screen-flex{display:flex;height:100vh;}
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;}
.sidebar-header{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border-soft);}
.flame-badge{width:28px;height:28px;border-radius:6px;background:rgba(196,99,46,.15);display:flex;align-items:center;justify-content:center;font-size:15px;}
.brand{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em;}
.btn-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;background:var(--ember);color:var(--bg);font-weight:500;font-size:13px;padding:10px 14px;border:none;}
.btn-primary:hover{background:var(--ember-bright);}
.btn-secondary{border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;padding:8px 14px;}
.btn-secondary:hover{border-color:var(--faint);}
.btn-ghost{background:none;border:none;color:var(--dim);font-size:13px;}
.btn-ghost:hover{color:var(--text);}
.nav{flex:1;padding:16px 12px 0;display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:10px;border-radius:6px;padding:9px 12px;font-size:13.5px;color:var(--dim);text-decoration:none;border:none;background:none;text-align:left;width:100%;}
.nav-item:hover{background:var(--panel);color:var(--text);}
.nav-item.active{background:var(--panel-raised);color:var(--text);}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--faint);line-height:1.5;}
.main{flex:1;min-width:0;overflow-y:auto;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;padding:32px 32px 24px;border-bottom:1px solid var(--border-soft);}
.page-title{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0;}
.page-desc{margin:4px 0 0;font-size:13.5px;color:var(--dim);max-width:520px;}
.page-body{padding:24px 32px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px;}
.stat-block{border:1px solid var(--border-soft);border-radius:8px;padding:14px 16px;}
.stat-label{font-size:11.5px;color:var(--faint);margin:0 0 4px;}
.stat-value{font-family:var(--font-display);font-size:24px;font-weight:600;margin:0;font-variant-numeric:tabular-nums;}
.panel{border:1px solid var(--border-soft);border-radius:8px;}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-soft);}
.panel-title{font-family:var(--font-display);font-weight:500;font-size:13.5px;margin:0;}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px;}
.empty-icon{width:44px;height:44px;border-radius:8px;background:var(--panel-raised);display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:20px;color:var(--faint);}
.empty-title{font-family:var(--font-display);font-weight:500;font-size:15px;margin:0;}
.empty-desc{margin:6px 0 0;font-size:13px;color:var(--faint);max-width:280px;}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-soft);}
.list-item:last-child{border-bottom:none;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-weight:400;font-size:11.5px;color:var(--faint);padding:10px 16px;border-bottom:1px solid var(--border-soft);}
td{padding:12px 16px;border-bottom:1px solid var(--border-soft);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--panel);}
.field{margin-bottom:16px;}
.field-label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;}
.field-hint{margin-top:5px;font-size:11px;color:var(--faint);}
.input,select.input,textarea.input{width:100%;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:9px 12px;font-size:14px;outline:none;}
.input:focus{border-color:var(--ember-bright);}
textarea.input{resize:none;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{padding:7px 12px;border-radius:6px;font-size:13px;border:none;background:none;color:var(--dim);}
.tab-btn.active{background:var(--panel-raised);color:var(--text);}
.tab-btn:hover{color:var(--text);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{width:100%;max-width:520px;border-radius:8px;border:1px solid var(--border);background:var(--panel);max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
.modal-title{font-family:var(--font-display);font-weight:600;font-size:15px;margin:0;}
.modal-body{padding:16px 20px;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border-soft);}
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.template-card{text-align:left;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text);padding:10px 12px;}
.template-card.selected{border-color:var(--ember-bright);background:rgba(196,99,46,.1);}
.template-card:hover{border-color:var(--faint);}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;text-transform:capitalize;}
.badge-ok{color:var(--copper-bright);background:rgba(91,112,101,.15);}
.badge-fail{color:var(--danger);background:rgba(184,80,63,.15);}
.badge-warn{color:var(--warn);background:rgba(201,154,63,.15);}
.badge-neutral{color:var(--faint);background:var(--panel-raised);}
.studio-flex{display:flex;height:100vh;}
.studio-nav-item{display:block;border-radius:6px;padding:9px 12px;font-size:13px;color:var(--dim);text-decoration:none;border:none;background:none;width:100%;text-align:left;}
.studio-nav-item:hover{background:var(--panel);color:var(--text);}
.studio-nav-item.active{background:var(--panel-raised);color:var(--text);}
.studio-body{flex:1;min-width:0;overflow-y:auto;padding:32px;max-width:720px;}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block;}
.dot-ok{background:var(--copper-bright);}
.dot-fail{background:var(--danger);}
.dot-warn{background:var(--warn);}
.dot-neutral{background:var(--faint);}
.toggle{display:flex;align-items:center;justify-content:space-between;border-radius:6px;border:1px solid var(--border-soft);padding:10px 12px;background:none;color:var(--text);width:100%;font-size:13px;}
.toggle:hover{border-color:var(--faint);}
.toggle-track{position:relative;width:36px;height:20px;border-radius:99px;background:var(--panel-raised);flex-shrink:0;}
.toggle-track.on{background:var(--ember);}
.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:var(--text);transition:transform .15s;}
.toggle-track.on .toggle-thumb{transform:translateX(16px);}
.upload-box{display:flex;align-items:center;gap:10px;border:1px dashed var(--border);border-radius:6px;padding:10px 12px;cursor:pointer;}
.upload-box:hover{border-color:var(--faint);}
.thumb{width:36px;height:36px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--panel-raised);}
.pill-icon{width:36px;height:36px;border-radius:5px;background:var(--panel-raised);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--faint);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.log-box{background:var(--bg);border:1px solid var(--border-soft);border-radius:6px;padding:12px;font-family:var(--font-mono);font-size:11.5px;color:var(--dim);}
.log-box p{margin:0 0 4px;}
.log-box p:last-child{margin:0;}
.note{display:flex;gap:10px;font-size:12px;color:var(--faint);border:1px solid var(--border-soft);border-radius:8px;padding:12px 16px;align-items:flex-start;}
.link-btn{background:none;border:none;color:var(--ember-bright);font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}
.icon-btn{background:none;border:none;color:var(--faint);padding:4px;}
.icon-btn:hover{color:var(--text);}
.menu{position:absolute;right:16px;margin-top:4px;width:170px;border-radius:6px;border:1px solid var(--border);background:var(--panel-raised);padding:4px 0;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 12px;font-size:13px;background:none;border:none;color:var(--text);}
.menu-item:hover{background:var(--panel);}
.menu-item.danger{color:var(--danger);}
.color-row{display:flex;align-items:center;gap:8px;}
.color-row input[type=color]{width:36px;height:36px;border-radius:6px;border:1px solid var(--border);background:var(--bg);padding:2px;}
.preview-window{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#0d0c0b;background-size:cover;background-position:center;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ DATA LAYER (localStorage) ============ */
const STORE_KEY = 'vynix_forge_data_v1';

const DEFAULT_SETTINGS = {
  accentColor: '#c4632e',       // dashboard chrome accent (not a project's own branding)
  defaultLoader: 'vanilla',     // applied to newly created projects
  defaultRamMin: 2048,
  defaultRamMax: 4096,
  buildTimeoutSec: 60,
  autoDownload: true            // auto-trigger download when a build completes
};

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // Backward-compatible: older saved data won't have a settings key yet.
      parsed.settings = {...DEFAULT_SETTINGS, ...(parsed.settings||{})};
      return parsed;
    }
  }catch(e){}
  return { projects:[], servers:[], files:[], builds:[], releases:[], settings:{...DEFAULT_SETTINGS} };
}
function saveDB(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    PERSIST_OK = true;
  }catch(e){
    // Root-cause fix: this used to throw uncaught (e.g. QuotaExceededError from
    // large base64 branding images bloating the stored JSON), which silently
    // aborted whatever function called it mid-flight -- including requestBuild(),
    // which is why builds could get created and then never advance past "queued".
    // We now degrade to in-memory-only operation instead of crashing the caller.
    PERSIST_OK = false;
    console.warn('Vynix Forge: could not persist to localStorage (quota exceeded or blocked). Continuing in-memory only.', e);
  }
}
let PERSIST_OK = true;
let DB = loadDB();

// FIX: there is no background worker/process in this app -- a "build" only ever
// advances while the tab that started it is open and running. If a build is
// left in any non-terminal state (queued/starting/building) when this script
// loads -- because the previous session hit the saveDB() bug above, crashed,
// or the tab was closed/reloaded mid-build -- it can never resume on its own.
// Sweep those into a real terminal state on every load instead of leaving them
// stuck forever.
function sweepInterruptedBuilds(){
  let changed = false;
  DB.builds.forEach(b=>{
    if(!['completed','failed'].includes(b.status)){
      b.status = 'failed';
      b.completedAt = Date.now();
      b.error = 'Interrupted: no build worker was running for this build (the tab was closed, reloaded, or an earlier bug left it stuck). This app builds synchronously in your browser tab, so an interrupted build cannot resume -- start a new one.';
      b.log = b.log || [];
      b.log.push('Build marked as failed on load: interrupted, no worker resumed it.');
      changed = true;
    }
  });
  if(changed) saveDB();
}
sweepInterruptedBuilds();

// ===== Theme (Appearance setting) =====
// Recomputes the dashboard's --ember/--ember-bright/--ember-dim CSS variables
// from the user's chosen accent color, so changing it in Settings visibly
// re-themes the whole app immediately -- not just a label that does nothing.
function shadeHex(hex, percent){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (n>>16) + Math.round(255*percent)));
  const g = Math.min(255, Math.max(0, ((n>>8)&0xff) + Math.round(255*percent)));
  const b = Math.min(255, Math.max(0, (n&0xff) + Math.round(255*percent)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyTheme(){
  const accent = (DB.settings && DB.settings.accentColor) || DEFAULT_SETTINGS.accentColor;
  const root = document.documentElement.style;
  root.setProperty('--ember', accent);
  root.setProperty('--ember-bright', shadeHex(accent, 0.16));
  root.setProperty('--ember-dim', shadeHex(accent, -0.35));
}
applyTheme();

function newId(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function defaultProject(id,name,template){
  const now = Date.now();
  const s = DB.settings || DEFAULT_SETTINGS;
  return {
    id, name, template: template||'custom', createdAt: now, updatedAt: now, archived:false,
    identity:{ launcherName:name, version:'0.1.0', publisher:'', description:'', website:'', discord:'' },
    branding:{ primaryColor:'#c4632e', accentColor:'#5b7065', textColor:'#ede8e1', icon:null, logo:null, background:null, splash:null },
    layout:{ sidebar:true, home:true, news:true, serverSelector:true, profile:true, settings:true, footer:true },
    features:{ news:true, serverStatus:true, discord:false, modManager:true, settings:true, updates:true, accountManagement:true },
    minecraft:{ version:'', loader:s.defaultLoader, javaRequirement:'', ram:{min:s.defaultRamMin, max:s.defaultRamMax} }
  };
}

/* ============ APP STATE ============ */
let state = {
  route:'overview', // overview|projects|servers|builds|files|updates|settings|studio
  studioProjectId:null,
  studioTab:'identity',
  showNewProject:false,
  newProjectName:'',
  newProjectTemplate:'custom',
  openMenuId:null,
  modsCategory:'required',
  showModrinth:false,
  modrinthQuery:'',
  modrinthResults:null,
  modrinthLoading:false,
  modrinthError:null,
  expandedBuildId:null,
  settingsSection:'Integrations',
  confirmingClear:false,
  filesFilter:'all',
  projectsShowArchived:false,
  releaseForm:{ projectId:'', version:'', channel:'stable', notes:'' },
  remoteBuild:null, // { buildId, kind, status, progress, log, error } for the in-progress Pro/Dev backend build, if any
  billingCurrency:'USD'
};

// Real, server-resolved identity/plan -- fetched from /api/me. Never
// trust or fall back to a client-side guess for this; it's null until the
// real backend responds, and the UI shows a loading/login gate until then.
let currentUser = null;

// Real prices fetched from /api/billing/plans (never hardcoded client-side --
// the backend's plans.js is the single source of truth for prices/currencies).
let pricingData = null;

function setState(patch){ Object.assign(state, patch); render(); }

/* ============ HELPERS ============ */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+'m ago';
  const h = Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function activeProjects(){ return DB.projects.filter(p=>!p.archived); }
function projectById(id){ return DB.projects.find(p=>p.id===id); }
function serversFor(id){ return DB.servers.filter(s=>s.projectId===id); }
function filesFor(id,cat){ return DB.files.filter(f=>f.projectId===id && (!cat || f.category===cat)); }
function buildsFor(id){ return DB.builds.filter(b=>b.projectId===id).sort((a,b)=>b.createdAt-a.createdAt); }

const TEMPLATES = [
  {id:'vanilla', name:'Vanilla', icon:'\u26cf\ufe0f', blurb:'Unmodified Minecraft, one server address.'},
  {id:'curated', name:'Curated', icon:'\u2694\ufe0f', blurb:'Vanilla-plus with a small handpicked mod list.'},
  {id:'modded', name:'Modded', icon:'\ud83e\udde9', blurb:'Heavier modpack, Forge or NeoForge.'},
  {id:'multi-server', name:'Multi-server', icon:'\ud83d\udc80', blurb:'More than one server in the selector.'},
  {id:'minigames', name:'Minigames', icon:'\ud83c\udfae', blurb:'Lobby + minigame server selector.'},
  {id:'custom', name:'Custom', icon:'\ud83d\udd27', blurb:'Start from a blank configuration.'}
];
const LOADERS = [['vanilla','Vanilla'],['fabric','Fabric'],['forge','Forge'],['neoforge','NeoForge']];

/* ============ ACTIONS ============ */
async function createProject(){
  const name = state.newProjectName.trim();
  if(!name) return;
  // Real, server-enforced limit check FIRST -- the local project record
  // (which holds the rich identity/branding/minecraft config this backend
  // doesn't store) only gets created if the backend actually allows it.
  let serverProject;
  try{
    const res = await fetch('/api/projects', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name })
    });
    const body = await res.json();
    if(!res.ok){
      alert(body.message || body.error || 'Could not create project.');
      return;
    }
    serverProject = body;
  }catch(e){
    alert('Could not reach the backend to create this project: '+e.message);
    return;
  }
  // Use the SAME id the backend assigned, so builds can reference one
  // consistent project identity across both the rich local config and the
  // server's plan/usage tracking.
  const project = defaultProject(serverProject.id, name, state.newProjectTemplate);
  DB.projects.unshift(project);
  saveDB();
  setState({ showNewProject:false, newProjectName:'', route:'studio', studioProjectId:project.id, studioTab:'identity' });
}
function duplicateProject(id){
  const orig = projectById(id); if(!orig) return;
  const nid = newId('proj'); const now = Date.now();
  DB.projects.unshift({...JSON.parse(JSON.stringify(orig)), id:nid, name:orig.name+' copy', createdAt:now, updatedAt:now, archived:false});
  serversFor(id).forEach(s=>DB.servers.push({...s, id:newId('srv'), projectId:nid}));
  filesFor(id).forEach(f=>DB.files.push({...f, id:newId('file'), projectId:nid}));
  saveDB(); setState({openMenuId:null});
}
function archiveProject(id,val){ const p=projectById(id); p.archived=val; p.updatedAt=Date.now(); saveDB(); setState({openMenuId:null}); }
function deleteProject(id){
  const p = projectById(id);
  if(!confirm('Delete "'+p.name+'"? This can\'t be undone.')) { setState({openMenuId:null}); return; }
  DB.projects = DB.projects.filter(x=>x.id!==id);
  DB.servers = DB.servers.filter(x=>x.projectId!==id);
  DB.files = DB.files.filter(x=>x.projectId!==id);
  DB.builds = DB.builds.filter(x=>x.projectId!==id);
  DB.releases = DB.releases.filter(x=>x.projectId!==id);
  saveDB(); setState({openMenuId:null});
}
function exportProject(id){
  const p = projectById(id);
  const blob = new Blob([JSON.stringify(p,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=p.name.replace(/\s+/g,'-').toLowerCase()+'.vynix.json'; a.click();
  URL.revokeObjectURL(url); setState({openMenuId:null});
}
function updateProject(id, patchFn){ const p=projectById(id); patchFn(p); p.updatedAt=Date.now(); saveDB(); render(); }

function addServer(projectId){
  DB.servers.push({ id:newId('srv'), projectId, name:'', address:'', port:25565, loader:'vanilla', javaRequirement:'', autoConnect:false, isDefault:false, updatedAt:Date.now() });
  saveDB(); render();
}
function updateServer(id, patchFn){ const s=DB.servers.find(x=>x.id===id); patchFn(s); s.updatedAt=Date.now(); saveDB(); render(); }
function deleteServer(id){ DB.servers = DB.servers.filter(s=>s.id!==id); saveDB(); render(); }

function addFile(projectId, file){ DB.files.push({ id:newId('file'), projectId, updatedAt:Date.now(), ...file }); saveDB(); render(); }
function deleteFile(id){ DB.files = DB.files.filter(f=>f.id!==id); saveDB(); render(); }

// ===== Build lifecycle =====
// Real states only: queued -> starting -> building -> completed | failed.
// No status is ever set without a real event causing it (see generateAndDownload).
const ARTIFACTS = {};      // buildId -> { blob, filename }  (in-memory only; see note below)
const RUNNING_PROJECTS = new Set(); // projectIds with a build currently in flight -- prevents duplicate/concurrent processing of the same project

function findBuild(id){ return DB.builds.find(b=>b.id===id); }

function setBuildStatus(id, status, progress){
  const b = findBuild(id); if(!b) return;
  b.status = status;
  if(progress != null) b.progress = progress;
  if(status === 'starting' && !b.startedAt) b.startedAt = Date.now();
  saveDB(); render();
}
function logBuild(id, line){
  const b = findBuild(id); if(!b) return;
  b.log.push(line);
  saveDB(); render();
}
function completeBuild(id, artifactName, artifactSize){
  const b = findBuild(id); if(!b) return;
  b.status = 'completed';
  b.progress = 100;
  b.completedAt = Date.now();
  b.artifactName = artifactName;
  b.artifactSize = artifactSize;
  b.log.push('Build completed. Artifact: '+artifactName+' ('+artifactSize+' bytes).');
  saveDB(); render();
}
function failBuild(id, message){
  const b = findBuild(id); if(!b) return;
  b.status = 'failed';
  b.completedAt = Date.now();
  b.error = message;
  b.progress = b.progress || 0;
  b.log.push('Build failed: '+message);
  saveDB(); render();
}

function requestBuild(projectId){
  const id = newId('build');
  DB.builds.unshift({
    id, projectId,
    createdAt: Date.now(), startedAt: null, completedAt: null,
    status: 'queued', progress: 0,
    log: ['Build queued.'],
    error: null, artifactName: null, artifactSize: null
  });
  saveDB(); return id;
}

function emptyState(ic,title,desc,action){

  (desc?'<p class="empty-desc">'+desc+'</p>':'')+(action?'<div style="margin-top:14px;">'+action+'</div>':'')+'</div>';
}
function statusDot(status){
  if(status==='completed') return 'ok';
  if(status==='failed') return 'fail';
  if(status==='starting'||status==='building') return 'warn';
  return 'neutral'; // queued
}
function statusBadgeClass(status){
  if(status==='completed') return 'badge-ok';
  if(status==='failed') return 'badge-fail';
  if(status==='starting'||status==='building') return 'badge-warn';
  return 'badge-neutral'; // queued
}
function statusLabel(status){
  return {queued:'Queued', starting:'Starting', building:'Building', completed:'Completed', failed:'Failed'}[status] || status;
}

function updateSettings(patchFn){

  patchFn(DB.settings);

function exportAllData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='vynix-forge-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function importAllData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.projects)) throw new Error("This file doesn't look like a Vynix Forge backup.");
      parsed.projects = parsed.projects||[]; parsed.servers = parsed.servers||[]; parsed.files = parsed.files||[];
      parsed.builds = parsed.builds||[]; parsed.releases = parsed.releases||[];
      parsed.settings = {...DEFAULT_SETTINGS, ...(parsed.settings||{})};
      DB = parsed;
      sweepInterruptedBuilds(); // in case the backup itself had unfinished builds
      saveDB(); applyTheme(); render();
      alert('Import complete: '+DB.projects.length+' project(s) restored.');
    }catch(e){
      alert('Import failed: '+e.message);
    }
  };
  reader.readAsText(file);
}

async function searchModrinth(projectId){
  const p = projectById(projectId);
  setState({modrinthLoading:true, modrinthError:null});
  try{
    const facets = [];
    if(p.minecraft.loader && p.minecraft.loader!=='vanilla') facets.push(['categories:'+p.minecraft.loader]);
    if(p.minecraft.version) facets.push(['versions:'+p.minecraft.version]);
    const params = new URLSearchParams({ query: state.modrinthQuery, limit:'20' });
    if(facets.length) params.set('facets', JSON.stringify(facets));
    const res = await fetch('https://api.modrinth.com/v2/search?'+params.toString());
    if(!res.ok) throw new Error('Modrinth API returned '+res.status);
    const data = await res.json();
    setState({ modrinthResults: data.hits||[], modrinthLoading:false });
  }catch(e){
    setState({ modrinthError: e.message || 'Failed to reach Modrinth.', modrinthResults:null, modrinthLoading:false });
  }
}

function validateProjectFull(p){

  if(!p.identity.launcherName) issues.push('Launcher name is not set (Identity tab).');

  if(p.minecraft.loader!=='vanilla' && !p.minecraft.javaRequirement) issues.push('Java requirement is recommended for non-vanilla loaders.');
  if(serversFor(p.id).length===0) issues.push('No servers configured \u2014 the launcher will have nothing to connect to.');
  if(p.minecraft.ram.max < p.minecraft.ram.min) issues.push('Maximum RAM is lower than minimum RAM.');
  return issues;

function studioBuild(p){
  const issues = validateProjectFull(p);
  const builds = buildsFor(p.id);
  const latest = builds[0]; // buildsFor already sorts newest-first
  const isRunning = RUNNING_PROJECTS.has(p.id);

  const validationHtml = issues.length===0 ?
    '<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--copper-bright);border:1px solid var(--border-soft);border-radius:8px;padding:10px 14px;">\u2713 Configuration looks valid.</div>' :
    issues.map(i=>'<div style="display:flex;gap:8px;font-size:13px;color:var(--warn);border:1px solid var(--border-soft);border-radius:8px;padding:10px 14px;margin-bottom:6px;">\u26a0 '+esc(i)+'</div>').join('');

  // Pipeline reflects the ACTUAL status of the most recent build for this
  // project, not a hardcoded mockup -- a stage only lights up once that real
  // build has genuinely reached it.
  const stages = ['queued','starting','building','completed'];
  let reachedIndex = -1;
  if(latest){
    if(latest.status === 'failed'){
      // Figure out how far it got before failing, from real recorded data.
      if(latest.progress >= 20) reachedIndex = 2;      // was building
      else if(latest.startedAt) reachedIndex = 1;       // was starting
      else reachedIndex = 0;                            // never left queued
    } else {
      reachedIndex = stages.indexOf(latest.status);
    }
  }
  const failedAt = latest && latest.status === 'failed';
  const pipeline = stages.map((label,i)=>{
    const reached = i <= reachedIndex;
    const isCurrent = reached && i===reachedIndex && !failedAt && latest.status!=='completed';
    const dotClass = !latest ? 'dot-neutral' : reached ? (isCurrent?'dot-warn':'dot-ok') : 'dot-neutral';
    return '<div style="display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 2px;">'+
      '<span class="dot '+dotClass+'"></span><span style="'+(reached?'':'color:var(--faint);')+'text-transform:capitalize;">'+label+'</span>'+
      (isCurrent && latest.progress!=null ? '<span style="font-size:10.5px;color:var(--faint);margin-left:auto;">'+latest.progress+'%</span>' : '')+
    '</div>';
  }).join('') + (failedAt ? '<div style="display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 2px;"><span class="dot dot-fail"></span><span>Failed</span></div>' : '');

  const buildHistory = builds.length===0 ? '<p style="text-align:center;padding:24px;border:1px dashed var(--border-soft);border-radius:8px;color:var(--faint);font-size:13px;">No builds yet.</p>' :
    '<div class="panel">'+builds.map(b=>{
      const inProgress = b.status==='starting' || b.status==='building';
      return '<div style="padding:10px 16px;border-bottom:1px solid var(--border-soft);">'+
        '<div style="display:flex;justify-content:space-between;"><span style="font-size:13px;">'+b.id+'</span><span class="badge '+statusBadgeClass(b.status)+'">'+statusLabel(b.status)+(inProgress&&b.progress!=null?' '+b.progress+'%':'')+'</span></div>'+
        '<p style="margin:4px 0 0;font-size:11px;color:var(--faint);">'+esc(b.log[b.log.length-1])+'</p>'+
        (b.status==='failed' && b.error ? '<p style="margin:4px 0 0;font-size:11.5px;color:var(--danger);">'+esc(b.error)+'</p>' : '')+
        '<div style="display:flex;gap:12px;margin-top:6px;">'+
          (b.status==='completed' ? '<button class="link-btn" onclick="redownloadBuild(\''+b.id+'\')">Download Build</button>' : '')+
          (b.status==='failed' ? '<button class="link-btn" onclick="retryBuild(\''+p.id+'\')">Retry build</button>' : '')+
        '</div>'+
      '</div>';
    }).join('')+'</div>';

  return studioPageHeader('Generate & build','Turn this configuration into a real project you can compile and distribute.')+
    '<h3 style="font-family:var(--font-display);font-weight:500;font-size:14px;margin:0 0 10px;">Validation</h3>'+validationHtml+
    '<h3 style="font-family:var(--font-display);font-weight:500;font-size:14px;margin:20px 0 10px;">Pipeline'+(latest?' (latest build)':'')+'</h3>'+pipeline+
    '<button class="btn-primary" style="width:auto;margin:12px 0 24px;'+(isRunning?'opacity:.6;':'')+'" '+(isRunning?'disabled':'')+' onclick="generateAndDownload(\''+p.id+'\')">'+(isRunning?'Working\u2026':'\u2b07 Generate & download source (Free)')+'</button>'+
    renderCloudBuildSection(p)+
    renderProductionExeSection(p)+
    '<h3 style="font-family:var(--font-display);font-weight:500;font-size:14px;margin:0 0 10px;">Build history</h3>'+buildHistory;
}

async function requestRemoteBuild(projectId, kind){
  const p = projectById(projectId);
  const servers = serversFor(projectId);
  const endpoint = kind === 'cloud' ? 'cloud' : 'production-exe';
  try{
    const res = await fetch('/api/builds/'+endpoint+'/'+projectId, {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ project: p, servers })
    });
    const body = await res.json();
    if(!res.ok){
      alert(body.message || body.error || 'Could not start build.');
      return;
    }
    state.remoteBuild = { id: body.buildId, projectId, kind, status:'queued', progress:0, log:['Build queued.'] };
    render();
    pollRemoteBuild(body.buildId);
  }catch(e){
    alert('Could not reach the backend: '+e.message);
  }
}

async function pollRemoteBuild(buildId){
  try{
    const res = await fetch('/api/builds/'+buildId, { credentials:'include' });
    if(!res.ok) return;
    const body = await res.json();
    if(!state.remoteBuild || state.remoteBuild.id !== buildId) return; // superseded
    state.remoteBuild = { ...state.remoteBuild, status: body.status, progress: body.progress, log: body.log, error: body.error };
    render();
    if(body.status === 'queued' || body.status === 'starting' || body.status === 'building'){
      setTimeout(() => pollRemoteBuild(buildId), 2000);
    }
  }catch(e){
    setTimeout(() => pollRemoteBuild(buildId), 4000); // transient network hiccup -- keep trying
  }
}




async function generateAndDownload(projectId){
  // Prevent duplicate/concurrent processing of the same project's build.
  if(RUNNING_PROJECTS.has(projectId)){
    alert('A build is already running for this project. Wait for it to finish before starting another.');
    return;
  }
  RUNNING_PROJECTS.add(projectId);

  const buildId = requestBuild(projectId);
  render(); // show the new queued build immediately, no refresh needed

  const timeoutMs = Math.max(5, (DB.settings && DB.settings.buildTimeoutSec) || DEFAULT_SETTINGS.buildTimeoutSec) * 1000;
  let timedOut = false;
  const timeoutHandle = setTimeout(() => {
    timedOut = true;
    failBuild(buildId, 'Build timed out after '+(timeoutMs/1000)+'s.');
    // If the code below is stuck forever on a dead await (a promise that
    // never settles), its own finally{} block will never run to release
    // this guard -- release it here instead, or the project could never
    // start another build again even though the UI correctly shows failed.
    RUNNING_PROJECTS.delete(projectId);
  }, timeoutMs);

  try{
    const p = projectById(projectId);
    if(!p) throw new Error('Project no longer exists (it may have been deleted while this build was queued).');

    setBuildStatus(buildId, 'starting', 5);
    logBuild(buildId, 'Validating project configuration\u2026');

    const issues = validateProjectFull(p);
    if(issues.length) throw new Error(issues.join(' '));
    logBuild(buildId, 'Project validated.');

    setBuildStatus(buildId, 'building', 30);
    logBuild(buildId, 'Requesting real source package from the backend\u2026');

    const servers = serversFor(projectId);
    const res = await fetch('/api/builds/source/'+projectId, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project: p, servers })
    });
    if(timedOut) return;

    if(!res.ok){
      let msg = 'Backend returned status '+res.status;
      try{ const errBody = await res.json(); msg = errBody.message || errBody.error || msg; }catch(_e){}
      throw new Error(msg);
    }

    setBuildStatus(buildId, 'building', 80);
    const blob = await res.blob();
    if(timedOut) return;

    // Never mark completed unless a real, non-empty artifact was produced.
    if(!blob || blob.size === 0){
      throw new Error('Backend returned an empty artifact -- refusing to mark this build as completed.');
    }

    const cd = res.headers.get('Content-Disposition') || '';
    const nameMatch = cd.match(/filename="([^"]+)"/);
    const filename = nameMatch ? nameMatch[1] : (p.identity.launcherName||p.name).replace(/\s+/g,'-').toLowerCase()+'-source.zip';
    ARTIFACTS[buildId] = { blob, filename };

    clearTimeout(timeoutHandle);
    completeBuild(buildId, filename, blob.size);

    // The build itself is done and the artifact is real and verified above --
    // auto-starting the download is a convenience, not part of the build. If
    // the browser blocks/fails it, that must never retroactively flip an
    // already-completed build back to failed (the artifact still exists and
    // is downloadable via the "Download Build" button either way).
    const autoDownload = DB.settings ? DB.settings.autoDownload : DEFAULT_SETTINGS.autoDownload;
    if(autoDownload){
      try{
        downloadBlob(blob, filename);
      }catch(downloadErr){
        logBuild(buildId, 'Note: automatic download did not start ('+downloadErr.message+'). Use the "Download Build" button below to get the artifact.');
      }
    }else{
      logBuild(buildId, 'Auto-download is turned off in Settings. Use the "Download Build" button below to get the artifact.');
    }
  }catch(e){
    clearTimeout(timeoutHandle);
    if(!timedOut) failBuild(buildId, e && e.message ? e.message : String(e));
  }finally{
    RUNNING_PROJECTS.delete(projectId);
  }
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// Re-download a completed build's real artifact without re-running the build.
// Only works for builds completed in the current tab session -- the raw zip
// bytes aren't persisted to localStorage (they'd blow the quota instantly and
// re-trigger the exact bug we just fixed), so a page reload clears them. This
// is stated plainly in the UI rather than faking persistence.
function redownloadBuild(buildId){
  const artifact = ARTIFACTS[buildId];
  if(!artifact){
    alert("This build's artifact is no longer available in memory (the page was reloaded since it completed). Click Generate again to produce a fresh download.");
    return;
  }
  downloadBlob(artifact.blob, artifact.filename);
}

function retryBuild(projectId){
  generateAndDownload(projectId);
}

  try{
    const res = await fetch('/api/me', { credentials: 'include' });
    if(res.status === 401){ currentUser = false; render(); return; }

    currentUser = { error: e.message };
    render();
  }
}

}

function renderLoginGate(){
  return '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">'+
    '<div class="flame-badge" style="width:44px;height:44px;font-size:22px;">'+icon('flame',22)+'</div>'+
    '<h1 style="font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;">Vynix Forge</h1>'+
    '<p style="color:var(--dim);font-size:13.5px;max-width:320px;text-align:center;margin:0;">Sign in with GitHub to create launcher projects and access Free/Pro/Dev build features.</p>'+
    '<a href="/auth/github/login" class="btn-primary" style="width:auto;text-decoration:none;display:inline-flex;">Sign in with GitHub</a>'+
  '</div>';
}
function renderAuthError(message){
  return '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">'+
    '<p style="color:var(--danger);font-size:13.5px;">Could not reach the backend: '+esc(message)+'</p>'+
    '<button class="btn-secondary" onclick="refreshCurrentUser()">Retry</button>'+
  '</div>';
}

/* ============ ROOT RENDER ============ */
function render(){
  if(currentUser === null){
    document.getElementById('app').innerHTML = '<div style="height:100vh;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;">Loading\u2026</div>';
    return;
  }
  if(currentUser === false){
    document.getElementById('app').innerHTML = renderLoginGate();
    return;
  }
  if(currentUser.error){
    document.getElementById('app').innerHTML = renderAuthError(currentUser.error);
    return;
  }
  let body;
  if(state.route==='overview') body = renderShell(renderOverview());
  else if(state.route==='projects') body = renderShell(renderProjects());
  else if(state.route==='servers') body = renderShell(renderServersPage());
  else if(state.route==='builds') body = renderShell(renderBuildsPage());
  else if(state.route==='files') body = renderShell(renderFilesPage());
  else if(state.route==='updates') body = renderShell(renderUpdatesPage());
  else if(state.route==='settings') body = renderShell(renderSettingsPage());
  else if(state.route==='studio') body = renderStudio() + (state.showNewProject ? renderNewProjectModal() : '');
  else body = renderShell(renderOverview());
  document.getElementById('app').innerHTML = body;
}
refreshCurrentUser();
</script>
</body>
</html>
