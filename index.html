<script>
/* ===========================================================
   VynixForge — Application Script
   All state is local (localStorage). No backend is assumed to
   exist. The BuildService object below is the ONLY place that
   would talk to a real build API — see BUILD SERVICE section.
=========================================================== */
"use strict";
/* ===================== CONSTANTS ===================== */
const LS_PROJECTS = "vynixforge.projects.v1";
const LS_SETTINGS = "vynixforge.settings.v1";

const MC_VERSIONS = ["1.21.4","1.21.3","1.21.1","1.21","1.20.6","1.20.4","1.20.1","1.19.4","1.18.2","1.17.1","1.16.5","1.12.2"];
const LAUNCHER_TYPES = [
  {id:"vanilla", label:"Vanilla", tagline:"Normal Minecraft launcher", desc:"Create a clean launcher for standard vanilla Minecraft gameplay.", icon:"minecraft"},
  {id:"modded", label:"Modded", tagline:"Modded Minecraft launcher", desc:"Create a launcher with support for mod loaders, mods, resource packs and shaders.", icon:"mods"}
];
const MOD_LOADERS = ["Fabric","Forge","NeoForge"];
const JAVA_VERSIONS = ["Java 8","Java 17","Java 21"];
const RESOLUTIONS = ["854x480","1280x720","1366x768","1600x900","1920x1080","2560x1440"];
const BUTTON_STYLES = ["Rounded","Sharp","Pill"];
const FONTS = ["Chakra Petch","Inter","JetBrains Mono","Rajdhani","Sora"];
const THEMES = [
  {id:"ember", label:"Ember Forge", accent:"#ff7a33", secondary:"#63b7d6"},
  {id:"emerald", label:"Emerald Depths", accent:"#3ecf8e", secondary:"#8b7bdb"},
  {id:"violet", label:"End Portal", accent:"#a97bff", secondary:"#33d6c0"},
  {id:"crimson", label:"Nether Crimson", accent:"#ff4d5e", secondary:"#ffb648"},
  {id:"azure", label:"Diamond Azure", accent:"#4fc3ff", secondary:"#8bffb0"}
];
const BUILD_STATES = ["ready","validating","queued","building","compiling","packaging","completed","failed"];

/* The build backend is NOT connected in this deployment.
   To connect a real build service, set BUILD_API_BASE below to
   your API origin, e.g. "https://build-api.vynixstudio.dev" */
const BUILD_API_BASE = null;

/* ===================== STORAGE ===================== */
function loadProjects(){
  try{
    const raw = localStorage.getItem(LS_PROJECTS);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return [];
    return parsed;
  }catch(e){ console.error("Failed to load projects", e); return []; }
}
function saveProjects(list){
  try{
    localStorage.setItem(LS_PROJECTS, JSON.stringify(list));
    return true;
  }catch(e){
    console.error("Failed to save projects", e);
    toast("Couldn't save — local storage may be full.", "error");
    return false;
  }
}
function defaultSettings(){
  return {
    theme:"dark",
    accent:"ember",
    compact:false,
    animations:true,
    autosave:true,
    discordEnabled:false,
    discordUrl:""
  };
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_SETTINGS);
    if(!raw) return defaultSettings();
    return Object.assign(defaultSettings(), JSON.parse(raw));
  }catch(e){ return defaultSettings(); }
}
function saveSettings(s){
  try{ localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }catch(e){ console.error(e); }
}

/* ===================== APP STATE ===================== */
const state = {
  projects: loadProjects(),
  settings: loadSettings(),
  route: parseHash(),
  navOpen: false
};

/* ===================== UTILS ===================== */
function uid(prefix){
  return (prefix||"id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function escapeHtml(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function escapeAttr(str){ return escapeHtml(str).replace(/`/g,"&#96;"); }
function clamp(n,min,max){ n = Number(n); if(isNaN(n)) return min; return Math.min(max, Math.max(min, n)); }
function isValidUrl(str){
  if(!str) return false;
  try{ const u = new URL(str); return u.protocol === "http:" || u.protocol === "https:"; }
  catch(e){ return false; }
}
function isValidHex(str){ return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(str||""); }
function isValidIp(str){
  if(!str) return false;
  // allow hostnames and IPv4
  return /^[a-zA-Z0-9]([a-zA-Z0-9\-\.]{0,253}[a-zA-Z0-9])?$/.test(str.trim());
}
function isValidPort(n){ n = Number(n); return Number.isInteger(n) && n >= 1 && n <= 65535; }
function isValidMcVersion(str){ return /^\d+\.\d+(\.\d+)?$/.test((str||"").trim()); }
function formatDate(ts){
  if(!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) + " · " +
         d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function timeAgo(ts){
  if(!ts) return "—";
  const s = Math.floor((Date.now()-ts)/1000);
  if(s < 60) return "just now";
  if(s < 3600) return Math.floor(s/60)+"m ago";
  if(s < 86400) return Math.floor(s/3600)+"h ago";
  if(s < 604800) return Math.floor(s/86400)+"d ago";
  return formatDate(ts);
}
function readFileAsDataUrl(file, maxBytes){
  return new Promise((resolve,reject) => {
    if(!file) return reject(new Error("No file"));
    if(!file.type || !file.type.startsWith("image/")){
      return reject(new Error("Only image files are allowed."));
    }
    if(maxBytes && file.size > maxBytes){
      return reject(new Error("Image is too large (max " + Math.round(maxBytes/1024/1024) + "MB)."));
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Couldn't read file."));
    reader.readAsDataURL(file);
  });
}

/* ===================== TOASTS ===================== */
const ICONS = {
  success: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M8.3 13.3 5 10l1.4-1.4L8.3 10.5l5.3-5.3L15 6.6z"/></svg>',
  error: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 12H9v-2h2zm0-4H9V5h2z"/></svg>',
  info: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 12H9V9h2zm0-6H9V6h2z"/></svg>'
};
function toast(msg, type){
  type = type || "info";
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = (ICONS[type]||ICONS.info) + "<div>" + escapeHtml(msg) + "</div>";
  stack.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition="opacity .25s"; setTimeout(()=>el.remove(), 260); }, 3600);
}

/* ===================== MODAL ===================== */
function closeModal(){
  const root = document.getElementById("modalRoot");
  root.innerHTML = "";
}
function openModal({title, bodyHtml, actions, wide}){
  const root = document.getElementById("modalRoot");
  const actionsHtml = (actions||[]).map(a =>
    `<button class="btn ${a.cls||''}" data-modal-action="${escapeAttr(a.id)}">${escapeHtml(a.label)}</button>`
  ).join("");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">
        <div class="modal-header">
          <div class="modal-title">${escapeHtml(title)}</div>
          <button class="btn btn-icon btn-ghost" data-modal-action="__close">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        ${actionsHtml ? `<div class="modal-actions">${actionsHtml}</div>` : ""}
      </div>
    </div>`;
  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if(e.target.id === "modalOverlay") closeModal();
  });
  root.querySelectorAll("[data-modal-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-modal-action");
      if(id === "__close"){ closeModal(); return; }
      const action = (actions||[]).find(a => a.id === id);
      if(action && action.onClick) action.onClick();
    });
  });
  const firstField = root.querySelector(".modal-body input, .modal-body textarea, .modal-body select");
  if(firstField) firstField.focus();
}
let modalEscapeBound = false;
function bindModalEscapeOnce(){
  if(modalEscapeBound) return;
  modalEscapeBound = true;
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && document.getElementById("modalOverlay")) closeModal();
  });
}

/* ===================== PROJECT MODEL ===================== */
function newProjectData({name, description, mcVersion, launcherType, modLoader}){
  const now = Date.now();
  const type = launcherType === "modded" ? "modded" : "vanilla";
  return {
    id: uid("proj"),
    name: name || "Untitled Launcher",
    description: description || "",
    createdAt: now,
    updatedAt: now,
    status: "draft", // draft | configured | validated | built
    launcherType: type, // vanilla | modded
    minecraft: {
      version: mcVersion || "1.21.1",
      loader: type === "modded" ? (MOD_LOADERS.includes(modLoader) ? modLoader : "Fabric") : "None",
      javaVersion: "Java 21",
      ramMin: 2,
      ramMax: 4,
      jvmArgs: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled",
      gameDirectory: "%appdata%/.vynixforge/" + slugify(name || "launcher"),
      resolution: "1280x720",
      fullscreen: false,
      launchArgs: ""
    },
    server: {
      enabled: false,
      name: "",
      ip: "",
      port: 25565,
      defaultServer: false,
      autoConnect: false,
      icon: null
    },
    mods: [],
    resourcePacks: [],
    shaders: [],
    branding: {
      launcherName: name || "My Launcher",
      logo: null,
      icon: null,
      background: null,
      accentColor: "#ff7a33",
      secondaryColor: "#63b7d6",
      textColor: "#f4eee2",
      font: "Chakra Petch",
      loadingScreenText: "Loading your world…",
      buttonStyle: "Rounded",
      theme: "ember"
    },
    discord: { enabled: state.settings ? !!state.settings.discordEnabled : false, url: state.settings ? state.settings.discordUrl : "" },
    build: {
      status: "ready", // ready | validating | queued | building | packaging | completed | failed
      buildId: null,
      launcherVersion: "1.0.0",
      createdTime: null,
      logs: []
    }
  };
}
function slugify(str){
  return (str||"launcher").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "launcher";
}
function getProject(id){ return state.projects.find(p => p.id === id); }
function persistProjects(){ saveProjects(state.projects); }
function createProject(data){
  const p = newProjectData(data);
  state.projects.unshift(p);
  persistProjects();
  return p;
}
function touchProject(p){ p.updatedAt = Date.now(); }
function updateProject(id, mutator){
  const p = getProject(id);
  if(!p) return null;
  mutator(p);
  touchProject(p);
  persistProjects();
  return p;
}
function deleteProject(id){
  state.projects = state.projects.filter(p => p.id !== id);
  persistProjects();
}
function duplicateProject(id){
  const p = getProject(id);
  if(!p) return null;
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = uid("proj");
  copy.name = p.name + " (Copy)";
  copy.createdAt = Date.now();
  copy.updatedAt = Date.now();
  copy.status = "draft";
  copy.build = { status:"ready", buildId:null, launcherVersion: p.build.launcherVersion || "1.0.0", createdTime:null, logs:[] };
  state.projects.unshift(copy);
  persistProjects();
  return copy;
}
function renameProject(id, name){
  updateProject(id, p => { p.name = name; });
}

/* ===================== ROUTER ===================== */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if(parts.length === 0) return { view:"dashboard" };
  if(parts[0] === "project" && parts[1]) return { view:"project", id:parts[1], step: parts[2] || "overview" };
  return { view: parts[0] || "dashboard" };
}
window.addEventListener("hashchange", () => { state.route = parseHash(); state.navOpen = false; render(); });

function go(hash){ location.hash = hash; }

  packs:'<svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 6l6-3 6 3v8l-6 3-6-3z" opacity=".2"/><path d="M4 6l6-3 6 3-6 3z"/><path d="M4 6v8l6 3v-8z" opacity=".55"/></svg>',

  export:'<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2v9m0 0l3-3m-3 3L7 8M4 14v3a1 1 0 001 1h10a1 1 0 001-1v-3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',

};

const ALL_PROJECT_STEPS = [
  {id:"overview", label:"Overview", icon:"overview"},
  {id:"minecraft", label:"Minecraft", icon:"minecraft"},
  {id:"server", label:"Server", icon:"server"},
  {id:"mods", label:"Mods", icon:"mods"},
  {id:"resourcepacks", label:"Resource Packs", icon:"packs"},
  {id:"shaders", label:"Shaders", icon:"shaders"},
  {id:"branding", label:"Branding", icon:"branding"},
  {id:"preview", label:"Preview", icon:"preview"},
  {id:"validate", label:"Validate", icon:"validate"},
  {id:"build", label:"Build", icon:"build"},
  {id:"export", label:"Export", icon:"export"}
];
const MODDED_ONLY_STEPS = ["mods","resourcepacks","shaders"];
function getProjectSteps(project){
  if(!project || project.launcherType !== "vanilla") return ALL_PROJECT_STEPS;
  return ALL_PROJECT_STEPS.filter(s => !MODDED_ONLY_STEPS.includes(s.id));
}

/* ===================== APP SHELL RENDER ===================== */
function render(){
  applySettingsToDom();
  const app = document.getElementById("app");
  const r = state.route;
  const inProject = r.view === "project" ? getProject(r.id) : null;

  app.innerHTML = `
    <aside class="sidebar">
      ${renderSidebar(r, inProject)}
    </aside>
    <div class="main-col">
      ${renderTopbar(r, inProject)}
      <div class="main-scroll ${r.view==='project' && ['preview','mods','build'].includes(r.step) ? 'wide':''}" id="mainScroll">
        ${renderView(r, inProject)}
      </div>
    </div>
  `;
  bindGlobalEvents();
  bindViewEvents(r, inProject);
  document.body.classList.toggle("nav-open", state.navOpen);
}

function sideLink(hash, icon, label, active, disabled){
  return `<div class="side-link ${active?'active':''} ${disabled?'disabled':''}" data-go="${escapeAttr(hash)}">
    ${NAV_ICONS[icon]||''}<span>${escapeHtml(label)}</span>
  </div>`;
}

function renderSidebar(r, project){
  const mainGroup = `
    <div class="side-group">
      <div class="side-group-label">Main</div>
      ${sideLink('#/dashboard','dashboard','Dashboard', r.view==='dashboard')}
      ${sideLink('#/dashboard','projects','My Projects', false)}
      ${sideLink('#/create','create','Create Launcher', r.view==='create')}
    </div>`;

  let projectGroup = "";
  if(project){
    const typeLabel = project.launcherType === "modded" ? ("Modded · " + project.minecraft.loader) : "Vanilla";
    projectGroup = `
    <div class="side-group">
      <div class="side-group-label">${escapeHtml(project.name)} <span style="opacity:.7">· ${escapeHtml(typeLabel)}</span></div>
      ${getProjectSteps(project).map(s => sideLink('#/project/'+project.id+'/'+s.id, s.icon, s.label, r.step===s.id)).join("")}
    </div>`;
  } else {
    projectGroup = `
    <div class="side-group">
      <div class="side-group-label">Project</div>
      <div class="side-link disabled">${NAV_ICONS.overview}<span>Open a project to edit it</span></div>
    </div>`;
  }

  const accountGroup = `
    <div class="side-group">
      <div class="side-group-label">Account / UI</div>
      ${sideLink('#/settings','settings','Settings', r.view==='settings')}
      ${sideLink('#/about','about','About VynixForge', r.view==='about')}
    </div>`;

  return `
    <div class="brand" data-go="#/dashboard" style="cursor:pointer">
      <div class="brand-mark"><svg viewBox="0 0 20 20" fill="#1a0e05"><path d="M10 2l1.6 3.3L15 6l-2.4 2.6L13 12l-3-1.7L7 12l.4-3.4L5 6l3.4-.7z"/></svg></div>
      <div class="brand-text"><div class="name">VynixForge</div><div class="studio">VYNIX STUDIO</div></div>
    </div>
    <div class="side-scroll">
      ${mainGroup}
      ${projectGroup}
      ${accountGroup}
    </div>
    <div class="side-footer">VynixForge v1.0 · Local build<br>Build service: ${BUILD_API_BASE ? '<span style="color:var(--success)">connected</span>' : '<span style="color:var(--text-3)">not connected</span>'}</div>
  `;
}

const STEP_TITLES = {
  dashboard:"Dashboard", create:"Create Launcher", settings:"Settings", about:"About VynixForge"
};
function renderTopbar(r, project){
  let crumb;
  if(r.view === "project" && project){
    const stepLabel = (ALL_PROJECT_STEPS.find(s=>s.id===r.step)||{}).label || "Overview";
    crumb = `<span>Projects</span><span class="sep">/</span><span>${escapeHtml(project.name)}</span><span class="sep">/</span><b class="crumb-current">${escapeHtml(stepLabel)}</b>`;
  } else {
    crumb = `<b class="crumb-current">${escapeHtml(STEP_TITLES[r.view] || "VynixForge")}</b>`;
  }
  return `
  <div class="topbar">
    <div class="topbar-left">
      <button class="btn btn-icon btn-ghost menu-btn" id="menuBtn" aria-label="Menu">

function statusDot(color){ return `<span style="width:6px;height:6px;border-radius:50%;background:${color};display:inline-block;margin-right:5px;"></span>`; }
function projectStatusColor(status){
  return { draft:"var(--text-3)", configured:"var(--info)", validated:"var(--warning)", built:"var(--success)" }[status] || "var(--text-3)";
}
function filterSortProjects(projects){
  let list = projects.slice();
  if(dashboardState.query.trim()){
    const q = dashboardState.query.trim().toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q) || (p.description||"").toLowerCase().includes(q));
  }
  if(dashboardState.type !== "all") list = list.filter(p => p.launcherType === dashboardState.type);
  if(dashboardState.status !== "all") list = list.filter(p => p.status === dashboardState.status);
  const sorters = {
    updated: (a,b) => b.updatedAt - a.updatedAt,
    created: (a,b) => b.createdAt - a.createdAt,
    name: (a,b) => a.name.localeCompare(b.name)
  };
  list.sort(sorters[dashboardState.sort] || sorters.updated);
  return list;
}

function renderPreservingFocus(id){
  const el = document.getElementById(id);
  const start = el ? el.selectionStart : null;
  const end = el ? el.selectionEnd : null;
  render();
  const newEl = document.getElementById(id);
  if(newEl){
    newEl.focus();
    if(start !== null && newEl.setSelectionRange){ try{ newEl.setSelectionRange(start, end); }catch(e){} }
  }
}

function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function openImportModal(){
  openModal({
    title:"Import project JSON",
    bodyHtml:`
      <p>Paste a VynixForge project export below. Imported data is validated before use — it is never executed.</p>
      <textarea id="importArea" style="min-height:160px;font-family:var(--font-mono);font-size:12px;" placeholder='{"name":"My Launcher", ...}'></textarea>
      <div class="field" style="margin-top:10px"><label>Or choose a file</label><input type="file" id="importFile" accept="application/json" style="display:block"></div>
    `,
    actions:[
      {id:"cancel", label:"Cancel", cls:"btn-ghost", onClick:closeModal},
      {id:"import", label:"Import", cls:"btn-primary", onClick:doImport}
    ]
  });
  const fileInput = document.getElementById("importFile");
  fileInput.style.display = "block";
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => { document.getElementById("importArea").value = reader.result; };
    reader.readAsText(f);
  });
}
function doImport(){
  const raw = document.getElementById("importArea").value.trim();
  if(!raw){ toast("Paste or choose JSON first", "error"); return; }
  let data;
  try{ data = JSON.parse(raw); }catch(e){ toast("Invalid JSON", "error"); return; }
  const items = Array.isArray(data) ? data : [data];
  let count = 0;
  items.forEach(item => {
    if(!item || typeof item !== "object") return;
    const safe = sanitizeImportedProject(item);
    if(safe){ state.projects.unshift(safe); count++; }
  });
  if(count === 0){ toast("No valid projects found in that JSON", "error"); return; }
  persistProjects();
  closeModal();
  toast("Imported " + count + " project" + (count===1?"":"s"), "success");
  render();
}
function sanitizeImportedProject(item){
  // Never trust imported data blindly — rebuild against the schema.
  const type = item.launcherType === "modded" ? "modded" : "vanilla";
  const base = newProjectData({
    name: typeof item.name === "string" ? item.name.slice(0,60) : "Imported Launcher",
    description: typeof item.description === "string" ? item.description.slice(0,300) : "",
    mcVersion: typeof item.minecraft?.version === "string" ? item.minecraft.version : "1.21.1",
    launcherType: type,
    modLoader: MOD_LOADERS.includes(item.minecraft?.loader) ? item.minecraft.loader : (MOD_LOADERS.includes(item.modLoader) ? item.modLoader : "Fabric")
  });
  base.id = uid("proj");
  try{
    if(item.minecraft){
      base.minecraft.javaVersion = JAVA_VERSIONS.includes(item.minecraft.javaVersion) ? item.minecraft.javaVersion : base.minecraft.javaVersion;
      base.minecraft.ramMin = clamp(item.minecraft.ramMin, 1, 32) || base.minecraft.ramMin;
      base.minecraft.ramMax = clamp(item.minecraft.ramMax, 1, 32) || base.minecraft.ramMax;
      base.minecraft.jvmArgs = typeof item.minecraft.jvmArgs === "string" ? item.minecraft.jvmArgs.slice(0,400) : base.minecraft.jvmArgs;
      base.minecraft.gameDirectory = typeof item.minecraft.gameDirectory === "string" ? item.minecraft.gameDirectory.slice(0,200) : base.minecraft.gameDirectory;
      base.minecraft.resolution = RESOLUTIONS.includes(item.minecraft.resolution) ? item.minecraft.resolution : base.minecraft.resolution;
      base.minecraft.fullscreen = !!item.minecraft.fullscreen;
      base.minecraft.launchArgs = typeof item.minecraft.launchArgs === "string" ? item.minecraft.launchArgs.slice(0,300) : "";
    }
    if(item.server){
      base.server.enabled = !!item.server.enabled;
      base.server.name = typeof item.server.name === "string" ? item.server.name.slice(0,60) : "";
      base.server.ip = typeof item.server.ip === "string" ? item.server.ip.slice(0,120) : "";
      base.server.port = clamp(item.server.port, 1, 65535) || 25565;
      base.server.defaultServer = !!item.server.defaultServer;
      base.server.autoConnect = !!item.server.autoConnect;
      base.server.icon = typeof item.server.icon === "string" && item.server.icon.startsWith("data:image") ? item.server.icon : null;
    }
    ["mods","resourcePacks","shaders"].forEach(key => {
      if(Array.isArray(item[key])){
        base[key] = item[key].slice(0,200).map(m => ({
          id: uid(key),
          name: typeof m.name === "string" ? m.name.slice(0,80) : "Untitled",
          url: typeof m.url === "string" && isValidUrl(m.url) ? m.url : "",
          version: typeof m.version === "string" ? m.version.slice(0,30) : "",
          loader: ["Any",...MOD_LOADERS].includes(m.loader) ? m.loader : "Any",
          enabled: m.enabled !== false
        }));
      }
    });
    if(item.branding){
      const b = item.branding;
      base.branding.launcherName = typeof b.launcherName === "string" ? b.launcherName.slice(0,60) : base.branding.launcherName;
      base.branding.accentColor = isValidHex(b.accentColor) ? b.accentColor : base.branding.accentColor;
      base.branding.secondaryColor = isValidHex(b.secondaryColor) ? b.secondaryColor : base.branding.secondaryColor;
      base.branding.textColor = isValidHex(b.textColor) ? b.textColor : base.branding.textColor;
      base.branding.font = FONTS.includes(b.font) ? b.font : base.branding.font;
      base.branding.loadingScreenText = typeof b.loadingScreenText === "string" ? b.loadingScreenText.slice(0,80) : base.branding.loadingScreenText;
      base.branding.buttonStyle = BUTTON_STYLES.includes(b.buttonStyle) ? b.buttonStyle : base.branding.buttonStyle;
      base.branding.theme = THEMES.some(t=>t.id===b.theme) ? b.theme : base.branding.theme;
      ["logo","icon","background"].forEach(k => {
        base.branding[k] = typeof b[k] === "string" && b[k].startsWith("data:image") ? b[k] : null;
      });
    }
    if(item.discord){
      base.discord.enabled = !!item.discord.enabled;
      base.discord.url = typeof item.discord.url === "string" && isValidUrl(item.discord.url) ? item.discord.url : "";
    }
  }catch(e){ console.error("Import sanitize error", e); }
  return base;
}

    const name = nameEl.value.trim();
    const nameField = nameEl.closest(".field");
    if(!name){ nameField.classList.add("invalid"); nameEl.focus(); return; }
    nameField.classList.remove("invalid");
    const p = createProject({
      name,
      description: document.getElementById("cDesc").value.trim(),
      mcVersion: document.getElementById("cVersion").value,
      launcherType: createSelectedType,
      modLoader: createSelectedType === "modded" ? document.getElementById("cLoader").value : null
    });
    toast(LAUNCHER_TYPES.find(t=>t.id===createSelectedType).label + " launcher project created", "success");
    go("#/project/" + p.id + "/overview");
  });
}



/* ===================== PROJECT STEP WRAPPER ===================== */
function stepIndex(step, project){ return getProjectSteps(project).findIndex(s => s.id === step); }
function renderStepper(project, step){
  const steps = getProjectSteps(project);
  const curIdx = steps.findIndex(s=>s.id===step);
  return `<div class="stepper-wrap"><div class="stepper">
    ${steps.map((s,i) => `
      <div class="step-pill ${i===curIdx?'active':''} ${i<curIdx?'done':''}" data-go="#/project/${project.id}/${s.id}">
        <span class="n">${i<curIdx ? '✓' : i+1}</span>${escapeHtml(s.label)}
      </div>`).join("")}
  </div></div>`;
}
function builderNav(project, step){
  const steps = getProjectSteps(project);
  const idx = steps.findIndex(s=>s.id===step);
  const prev = steps[idx-1];
  const next = steps[idx+1];
  return `<div class="builder-nav">
    <div>${prev ? `<button class="btn btn-outline" data-go="#/project/${project.id}/${prev.id}">← ${escapeHtml(prev.label)}</button>` : `<button class="btn btn-outline" data-go="#/dashboard">← Dashboard</button>`}</div>
    <div>${next ? `<button class="btn btn-primary" data-go="#/project/${project.id}/${next.id}">Continue to ${escapeHtml(next.label)} →</button>` : ""}</div>
  </div>`;
}
function renderProjectStep(project, step){
  if(project.launcherType === "vanilla" && MODDED_ONLY_STEPS.includes(step)){
    return renderStepper(project, "minecraft") + `
    <div class="empty-state">
      <svg class="glyph" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 12H9V9h2zm0-6H9V6h2z"/></svg>
      <h3>${escapeHtml(ALL_PROJECT_STEPS.find(s=>s.id===step).label)} isn't available for Vanilla launchers</h3>
      <p>Mods, resource packs and shaders belong to Modded launchers. Switch this project to Modded on the Overview step if you want to add them.</p>
      <button class="btn btn-primary" data-go="#/project/${project.id}/overview">Go to Overview</button>
    </div>`;
  }
  const stepFns = {
    overview: renderStepOverview, minecraft: renderStepMinecraft, server: renderStepServer,
    mods: renderStepMods, resourcepacks: renderStepPacks, shaders: renderStepShaders,
    branding: renderStepBranding, preview: renderStepPreview, validate: renderStepValidate,
    build: renderStepBuild, export: renderStepExport
  };
  const fn = stepFns[step] || renderStepOverview;
  return `${renderStepper(project, step)}${fn(project)}`;
}
function bindProjectStepEvents(project, step){
  if(project.launcherType === "vanilla" && MODDED_ONLY_STEPS.includes(step)){
    document.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => go(el.getAttribute("data-go"))));
    return;
  }
  const fns = {
    overview: bindStepOverview, minecraft: bindStepMinecraft, server: bindStepServer,
    mods: bindStepMods, resourcepacks: bindStepPacks, shaders: bindStepShaders,
    branding: bindStepBranding, preview: bindStepPreview, validate: bindStepValidate,
    build: bindStepBuild, export: bindStepExport
  };
  (fns[step] || bindStepOverview)(project);
  document.querySelectorAll("[data-go]").forEach(el => {
    el.addEventListener("click", () => go(el.getAttribute("data-go")));
  });
}
function saveField(project, path, value){
  updateProject(project.id, p => {
    const parts = path.split(".");
    let obj = p;
    for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
    obj[parts[parts.length-1]] = value;
  });
}
function bindAutosaveInputs(container, project, map){
  // map: { elementId: {path, transform} }
  Object.keys(map).forEach(elId => {
    const el = document.getElementById(elId);
    if(!el) return;
    const {path, transform, evt} = map[elId];
    el.addEventListener(evt || (el.tagName==="SELECT"||el.type==="checkbox"||el.type==="color"?"change":"input"), () => {
      let val = el.type === "checkbox" ? el.checked : el.value;
      if(transform) val = transform(val);
      saveField(project, path, val);
      if(state.settings.autosave){ flashAutosaved(); }
    });
  });
}
let autosaveFlashTimer = null;
function flashAutosaved(){
  const el = document.getElementById("autosaveIndicator");
  if(!el) return;
  el.textContent = "Saved just now";
  el.style.color = "var(--success)";
  clearTimeout(autosaveFlashTimer);
  autosaveFlashTimer = setTimeout(() => { el.textContent = "Autosave on"; el.style.color = ""; }, 1800);
}

        openModal({
          title:"Switch to Vanilla?",

  });

    const min = clamp(ramMin.value, 1, 32);

      if(state.settings.autosave) flashAutosaved();
    }

  ramMax.addEventListener("input", validateRam);
}

  const items = project[key];
  const rows = items.map((it, idx) => `
    <div class="list-row ${it.enabled?'':'disabled-row'}" data-id="${it.id}">
      <div class="drag" title="Reorder">
        <div style="display:flex;flex-direction:column;gap:2px;">

        </div>
      </div>

        <div class="t1">${escapeHtml(it.name)} ${it.version?`<span class="tag">${escapeHtml(it.version)}</span>`:''} ${showLoader && it.loader ? `<span class="tag">${escapeHtml(it.loader)}</span>`:''}</div>

        <button class="btn btn-sm btn-danger" data-remove="${it.id}">Remove</button>
      </div>

  return `

  ${items.length === 0 ? `

}
function bindContentList(project, key, {noun, showLoader}){
  function openItemModal(existing){
    const it = existing || {id:null, name:"", url:"", version:"", loader:"Any", enabled:true};
    openModal({
      title: existing ? "Edit " + noun : "Add " + noun,
      bodyHtml: `
        <div class="field"><label>Name *</label><input type="text" id="itName" value="${escapeAttr(it.name)}" maxlength="80"></div>
        <div class="field"><label>URL</label><input type="text" id="itUrl" value="${escapeAttr(it.url)}" placeholder="https://modrinth.com/... or https://curseforge.com/...">
          <div class="err" id="itUrlErr">Enter a valid https:// URL.</div>
        </div>
        <div class="field-row">
          <div class="field"><label>Version</label><input type="text" id="itVersion" value="${escapeAttr(it.version)}" placeholder="1.4.2" maxlength="30"></div>
          ${showLoader ? `<div class="field"><label>Loader compatibility</label><select id="itLoader">${["Any",...MOD_LOADERS].map(l=>`<option value="${l}" ${l===it.loader?'selected':''}>${l}</option>`).join("")}</select></div>` : ""}
        </div>
        <div class="switch-row"><div class="label">Enabled</div><label class="switch"><input type="checkbox" id="itEnabled" ${it.enabled?'checked':''}><span class="track"></span></label></div>
      `,
      actions:[
        {id:"cancel", label:"Cancel", cls:"btn-ghost", onClick:closeModal},
        {id:"save", label: existing ? "Save changes" : "Add " + noun, cls:"btn-primary", onClick:() => {
          const name = document.getElementById("itName").value.trim();
          const url = document.getElementById("itUrl").value.trim();
          if(!name){ toast("Name is required", "error"); return; }
          if(url && !isValidUrl(url)){ document.getElementById("itUrlErr").style.display="block"; document.getElementById("itUrl").closest(".field").classList.add("invalid"); return; }
          const payload = {
            id: it.id || uid(key),
            name, url,
            version: document.getElementById("itVersion").value.trim(),
            loader: showLoader ? document.getElementById("itLoader").value : "Any",
            enabled: document.getElementById("itEnabled").checked
          };
          updateProject(project.id, p => {
            if(existing){
              const i = p[key].findIndex(x => x.id === it.id);
              if(i>-1) p[key][i] = payload;
            } else {
              p[key].push(payload);
            }
          });
          closeModal();
          toast((existing?"Updated ":"Added ") + name, "success");
          render(); go(location.hash);
        }}
      ]
    });
  }
  const addBtn = document.getElementById("addItemBtn");
  const addBtn2 = document.getElementById("addItemBtnEmpty");
  if(addBtn) addBtn.addEventListener("click", () => openItemModal(null));
  if(addBtn2) addBtn2.addEventListener("click", () => openItemModal(null));
  document.querySelectorAll("[data-edit]").forEach(el => {
    el.addEventListener("click", () => {
      const it = project[key].find(x => x.id === el.getAttribute("data-edit"));
      if(it) openItemModal(it);
    });
  });
  document.querySelectorAll("[data-remove]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-remove");
      updateProject(project.id, p => { p[key] = p[key].filter(x => x.id !== id); });
      toast("Removed", "info"); render(); go(location.hash);
    });
  });
  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("change", () => {
      const id = el.getAttribute("data-toggle");
      updateProject(project.id, p => { const it = p[key].find(x=>x.id===id); if(it) it.enabled = el.checked; });
      render(); go(location.hash);
    });
  });
  document.querySelectorAll("[data-move]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-id");
      const dir = el.getAttribute("data-move");
      updateProject(project.id, p => {
        const arr = p[key];
        const i = arr.findIndex(x => x.id === id);
        const j = dir === "up" ? i-1 : i+1;
        if(j<0 || j>=arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]];
      });
      render(); go(location.hash);
    });
  });
}

function shade(hex, pct){
  try{
    let c = hex.replace("#","");
    if(c.length===3) c = c.split("").map(x=>x+x).join("");
    const num = parseInt(c,16);
    let r = (num>>16)+Math.round(2.55*pct);
    let g = ((num>>8)&0xff)+Math.round(2.55*pct);
    let bl = (num&0xff)+Math.round(2.55*pct);
    r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); bl=Math.min(255,Math.max(0,bl));
    return "#"+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
  }catch(e){ return hex; }
}

/* ===================== VALIDATION ENGINE ===================== */
function validateProject(project){
  const checks = [];
  const push = (ok, label, detail) => checks.push({ok, label, detail});

  push(!!project.name.trim(), "Launcher name", project.name.trim() ? "\"" + project.name + "\" set." : "Give this project a name.");
  push(isValidMcVersion(project.minecraft.version), "Minecraft version", isValidMcVersion(project.minecraft.version) ? project.minecraft.version + " is a valid version string." : "Version must look like 1.20.1.");
  if(project.launcherType === "modded"){
    push(MOD_LOADERS.includes(project.minecraft.loader), "Mod loader", MOD_LOADERS.includes(project.minecraft.loader) ? "Loader: " + project.minecraft.loader : "Choose Fabric, Forge or NeoForge.");
  } else {
    push(true, "Launcher type", "Vanilla launcher — no mod loader required.");
  }
  push(project.minecraft.ramMax >= project.minecraft.ramMin, "Memory allocation", project.minecraft.ramMax >= project.minecraft.ramMin ? project.minecraft.ramMin+"–"+project.minecraft.ramMax+" GB" : "Max RAM must be ≥ min RAM.");
  push(!!project.minecraft.gameDirectory.trim(), "Game directory", project.minecraft.gameDirectory.trim() ? project.minecraft.gameDirectory : "Set a game directory.");

  if(project.server.enabled){
    push(!!project.server.name.trim(), "Server name", project.server.name.trim() ? project.server.name : "Server is enabled but has no name.");
    push(isValidIp(project.server.ip), "Server address", isValidIp(project.server.ip) ? project.server.ip : "Enter a valid server IP or hostname.");
    push(isValidPort(project.server.port), "Server port", isValidPort(project.server.port) ? String(project.server.port) : "Port must be 1–65535.");
  } else {
    push(true, "Server", "No bundled server (optional).");
  }

  if(project.launcherType === "modded"){
    const enabledMods = project.mods.filter(m=>m.enabled);
    const badMods = enabledMods.filter(m => !m.name.trim() || (m.url && !isValidUrl(m.url)));
    push(badMods.length===0, "Mods", badMods.length===0 ? enabledMods.length+" enabled mod(s) look valid." : badMods.length+" mod(s) have a missing name or invalid URL.");

    const badPacks = project.resourcePacks.filter(m=>m.enabled).filter(m => !m.name.trim() || (m.url && !isValidUrl(m.url)));
    push(badPacks.length===0, "Resource packs", badPacks.length===0 ? "Configuration looks valid." : badPacks.length+" pack(s) have a missing name or invalid URL.");

    const badShaders = project.shaders.filter(m=>m.enabled).filter(m => !m.name.trim() || (m.url && !isValidUrl(m.url)));
    push(badShaders.length===0, "Shaders", badShaders.length===0 ? "Configuration looks valid." : badShaders.length+" shader(s) have a missing name or invalid URL.");
  }

  push(!!project.branding.launcherName.trim(), "Branding — launcher name", project.branding.launcherName.trim() || "Set a launcher display name.");
  push(isValidHex(project.branding.accentColor), "Branding — accent color", isValidHex(project.branding.accentColor) ? project.branding.accentColor : "Accent color must be a valid hex code.");
  push(isValidHex(project.branding.textColor), "Branding — text color", isValidHex(project.branding.textColor) ? project.branding.textColor : "Text color must be a valid hex code.");

  if(project.discord.enabled){
    push(isValidUrl(project.discord.url), "Discord / support link", isValidUrl(project.discord.url) ? project.discord.url : "Enabled but URL is missing or invalid.");
  }

  const passed = checks.every(c => c.ok);
  return { passed, checks };
}

/* ---------- VALIDATE STEP ---------- */
function renderStepValidate(project){
  const {passed, checks} = validateProject(project);
  return `
  <div class="section-head"><div><h1>Validate Configuration</h1><div class="sub">Runs entirely in your browser before anything is sent to a build service.</div></div></div>

  <div class="build-status-card" style="margin-bottom:20px;">
    <div class="build-status-icon" style="background:${passed?'var(--success-bg)':'var(--danger-bg)'};color:${passed?'var(--success)':'var(--danger)'}">
      ${passed ? '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M8.3 13.3 5 10l1.4-1.4L8.3 10.5l5.3-5.3L15 6.6z"/></svg>' : '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 12H9v-2h2zm0-4H9V5h2z"/></svg>'}
    </div>
    <div>
      <div class="card-title">${passed ? "Ready to build" : (checks.filter(c=>!c.ok).length) + " issue(s) to fix"}</div>
      <div class="card-desc">${passed ? "All required fields are valid. You can continue to the build step." : "Resolve the issues below, then re-run validation."}</div>
    </div>
  </div>

  ${checks.map(c => `
    <div class="check-row ${c.ok?'ok':'fail'}">
      <div class="icon">${c.ok ? '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M8.3 13.3 5 10l1.4-1.4L8.3 10.5l5.3-5.3L15 6.6z"/></svg>' : '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'}</div>
      <div class="body"><b>${escapeHtml(c.label)}</b><p>${escapeHtml(c.detail)}</p></div>
    </div>`).join("")}

  <div class="builder-nav">
    <div><button class="btn btn-outline" data-go="#/project/${project.id}/preview">← Preview</button></div>
    <div>
      <button class="btn ${passed?'btn-primary':'btn-outline'}" id="reValidateBtn" style="margin-right:8px;">Re-run validation</button>
      <button class="btn btn-primary" data-go="#/project/${project.id}/build" ${passed?'':'disabled'}>Continue to Build →</button>
    </div>
  </div>
  `;
}
function bindStepValidate(project){
  const passed = validateProject(project).passed;

/* ===================== BUILD SERVICE ABSTRACTION =====================
   This is the ONLY place a real build backend would be called from.
   BUILD_API_BASE is null in this deployment, so isConnected() is false
   and every method below refuses to run rather than faking a result.
   Wire up a real backend by setting BUILD_API_BASE near the top of
   this file, matching the contract in the comments below. */
const BuildService = {
  isConnected(){ return typeof BUILD_API_BASE === "string" && BUILD_API_BASE.length > 0; },
  async submitBuild(config){
    // Real contract: POST {BUILD_API_BASE}/build  body: config  -> { buildId }
    if(!this.isConnected()) throw new Error("BUILD_SERVICE_NOT_CONNECTED");
    const res = await fetch(BUILD_API_BASE + "/build", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(config)
    });
    if(!res.ok) throw new Error("Build request failed (" + res.status + ")");
    return res.json();
  },
  async getStatus(buildId){
    // Real contract: GET {BUILD_API_BASE}/build/{id} -> { status, progress, logs[] }
    if(!this.isConnected()) throw new Error("BUILD_SERVICE_NOT_CONNECTED");
    const res = await fetch(BUILD_API_BASE + "/build/" + encodeURIComponent(buildId));
    if(!res.ok) throw new Error("Couldn't fetch build status (" + res.status + ")");
    return res.json();
  },
  downloadUrl(buildId){
    // Real contract: GET {BUILD_API_BASE}/build/{id}/download -> the .exe
    if(!this.isConnected()) return null;
    return BUILD_API_BASE + "/build/" + encodeURIComponent(buildId) + "/download";
  }
};

   project is structured so `npm install && npm run build` produces a
   real Windows .exe locally via electron-builder, with no backend

function readmeTemplate(project, cfg){
  const name = project.branding.launcherName || project.name;
  return `# ${name}

Generated with VynixForge — Minecraft Launcher Builder by Vynix Studio.

Launcher type: **${project.launcherType === "modded" ? "Modded (" + project.minecraft.loader + ")" : "Vanilla"}**
Minecraft version: **${project.minecraft.version}**
Launcher version: **${project.build.launcherVersion}**

This is a real Electron project scaffold. It is not a finished .exe — you (or a
connected build service) still need to install dependencies and run the build.

## Requirements

- Windows, macOS or Linux (target output below is Windows)
- [Node.js](https://nodejs.org) 18 or newer
- npm

## Install

\`\`\`
npm install
\`\`\`

## Development

Runs the launcher UI in a local Electron window so you can check branding and layout:

\`\`\`
npm start
\`\`\`

## Build Windows EXE

\`\`\`
npm run build
\`\`\`

The generated executable will be placed in the \`dist/\` folder as

## What's included

- \`src/main.js\` — Electron main process, window creation, IPC wiring
- \`src/config.js\` — your launcher configuration, generated from VynixForge

function minecraftJsTemplate(project){
  return `// Real launch logic using the minecraft-launcher-core package
// https://www.npmjs.com/package/minecraft-launcher-core
const { Client, Authenticator } = require("minecraft-launcher-core");

  const root = config.minecraft.gameDirectory.replace("%appdata%", path.join(os.homedir(), "AppData", "Roaming"));

    authorization: Authenticator.getAuth(username || "Player"),
    root,

  };

  launcher.on("data", (e) => console.log("[minecraft]", e));

}

module.exports = { launchMinecraft };

function serverJsTemplate(project){
  return `// Bundled server status check
const net = require("net");

function pingServer(host, port, timeoutMs = 3000){
  return new Promise((resolve) => {
    const socket = new net.Socket();
    const start = Date.now();
    let done = false;
    socket.setTimeout(timeoutMs);
    socket.on("connect", () => { done = true; socket.destroy(); resolve({ online: true, latencyMs: Date.now() - start }); });
    socket.on("timeout", () => { if(!done){ socket.destroy(); resolve({ online: false, error: "timeout" }); } });
    socket.on("error", (err) => { if(!done){ resolve({ online: false, error: err.message }); } });
    socket.connect(port, host);
  });
}
module.exports = { pingServer };
`;
}

function generateSourceFiles(project){
  const cfg = buildLauncherConfig(project);
  const files = {};
  files["README.md"] = readmeTemplate(project, cfg);
  files["package.json"] = packageJsonTemplate(project);
  files["launcher-config.json"] = JSON.stringify(cfg, null, 2);

function dataUrlToBase64(dataUrl){
  const comma = dataUrl.indexOf(",");
  const meta = dataUrl.slice(5, comma); // strip "data:"
  const ext = (meta.match(/image\/(\w+)/) || [,"png"])[1];
  return { base64: dataUrl.slice(comma+1), ext };
}
async function exportLauncherSourceZip(project){
  if(typeof JSZip === "undefined"){
    toast("The ZIP library didn't load — check your connection and try again.", "error");
    return;
  }
  const slug = slugify(project.branding.launcherName || project.name);
  const zip = new JSZip();
  const root = zip.folder(slug);
  const files = generateSourceFiles(project);
  Object.keys(files).forEach(path => root.file(path, files[path]));
  const assets = root.folder("assets");
  let assetCount = 0;
  ["logo","icon","background"].forEach(key => {
    const dataUrl = project.branding[key];
    if(dataUrl){ const {base64, ext} = dataUrlToBase64(dataUrl); assets.file(key+"."+ext, base64, {base64:true}); assetCount++; }
  });
  if(project.server.icon){
    const {base64, ext} = dataUrlToBase64(project.server.icon);
    assets.file("server-icon."+ext, base64, {base64:true});
    assetCount++;
  }
  const blob = await zip.generateAsync({type:"blob"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = slug + "-v" + (project.build.launcherVersion||"1.0.0") + "-source.zip";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return assetCount;
}

    <div><button class="btn btn-primary" data-go="#/project/${project.id}/export">Continue to Export →</button></div>
  </div>
  `;
}
function bindStepBuild(project){
  const connected = BuildService.isConnected();
  const {passed} = validateProject(project);
  document.getElementById("buildLauncherBtn").addEventListener("click", async () => {
    if(!connected){
      toast("Build service isn't connected — no .exe was built. Try Export Launcher Source instead.", "error");
      return;
    }
    if(!passed){ toast("Fix validation issues first", "error"); return; }
    try{
      updateProject(project.id, p => { p.build.status = "queued"; p.build.createdTime = Date.now(); p.build.logs.push({time:Date.now(), message:"Build submitted to build service."}); });
      const config = buildLauncherConfig(project);
      const res = await BuildService.submitBuild(config);
      updateProject(project.id, p => { p.build.buildId = res.buildId || null; });
      toast("Build submitted", "success");
      render(); go("#/project/"+project.id+"/build");
    }catch(e){
      updateProject(project.id, p => { p.build.status = "failed"; p.build.logs.push({time:Date.now(), message:"Error: " + e.message}); });
      toast("Build failed: " + e.message, "error");
      render(); go("#/project/"+project.id+"/build");
    }
  });
  document.getElementById("exportSourceBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true; const originalLabel = btn.textContent; btn.textContent = "Packaging…";
    try{
      const count = await exportLauncherSourceZip(project);
      toast("Launcher source exported" + (count ? " with " + count + " asset(s)" : ""), "success");
    }catch(err){
      console.error(err);
      toast("Couldn't build the ZIP: " + err.message, "error");
    }finally{
      btn.disabled = false; btn.textContent = originalLabel;
    }
  });
  document.getElementById("viewConfigBtn").addEventListener("click", () => openConfigModal(project));
  document.getElementById("copyConfigBtn").addEventListener("click", () => copyConfig(project));
  document.getElementById("downloadConfigBtn").addEventListener("click", () => {
    downloadJson(buildLauncherConfig(project), slugify(project.name) + ".vynixforge.json");
    toast("Configuration downloaded", "success");
  });
}
function openConfigModal(project){
  const json = JSON.stringify(buildLauncherConfig(project), null, 2);
  openModal({
    title:"Launcher configuration — " + project.name,
    wide:true,
    bodyHtml: `<p>This is what would be sent to <code>POST /build</code> on a connected build service — and what's embedded as <code>launcher-config.json</code> in the exported source.</p><pre>${escapeHtml(json)}</pre>`,
    actions:[
      {id:"close", label:"Close", cls:"btn-ghost", onClick:closeModal},
      {id:"copy", label:"Copy JSON", cls:"btn-primary", onClick:() => copyConfig(project)}
    ]
  });
}
async function copyConfig(project){
  const json = JSON.stringify(buildLauncherConfig(project), null, 2);
  try{
    await navigator.clipboard.writeText(json);
    toast("Configuration copied to clipboard", "success");
  }catch(e){
    toast("Couldn't access clipboard — use Download JSON instead.", "error");
  }
}

/* ---------- EXPORT STEP ---------- */
function renderStepExport(project){
  const buildJson = JSON.stringify(buildLauncherConfig(project), null, 2);
  return `
  <div class="section-head"><div><h1>Export</h1><div class="sub">Structured JSON any build backend can consume — plus a full project backup.</div></div></div>

  <div class="card">
    <div class="card-header"><div><div class="card-title">Build-service configuration</div><div class="card-desc">Matches the payload a real build service's <code>POST /build</code> would receive.</div></div></div>
    <pre>${escapeHtml(buildJson.length > 2400 ? buildJson.slice(0,2400) + "\n  …" : buildJson)}</pre>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" id="viewFullConfigBtn">View full JSON</button>
      <button class="btn btn-outline btn-sm" id="copyBuildJsonBtn">Copy JSON</button>
      <button class="btn btn-primary btn-sm" id="downloadBuildJsonBtn">Download JSON</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><div><div class="card-title">Launcher source project</div><div class="card-desc">A real, buildable project — source code, assets and config — as a .zip.</div></div></div>
    <button class="btn btn-primary btn-sm" id="exportSourceBtn2">Export Launcher Source</button>
  </div>

  <div class="card">
    <div class="card-header"><div><div class="card-title">Full project backup</div><div class="card-desc">Includes uploaded images — use this to re-import the project later.</div></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" id="downloadFullBtn">Download project JSON</button>
      <button class="btn btn-outline btn-sm" id="copyFullBtn">Copy project JSON</button>
    </div>
  </div>

  <div class="builder-nav">
    <div><button class="btn btn-outline" data-go="#/project/${project.id}/build">← Build</button></div>
    <div><button class="btn btn-outline" data-go="#/dashboard">Back to dashboard</button></div>
  </div>
  `;
}
function bindStepExport(project){
  document.getElementById("viewFullConfigBtn").addEventListener("click", () => openConfigModal(project));
  document.getElementById("copyBuildJsonBtn").addEventListener("click", () => copyConfig(project));
  document.getElementById("downloadBuildJsonBtn").addEventListener("click", () => {
    downloadJson(buildLauncherConfig(project), slugify(project.name) + ".vynixforge.json");
    toast("Build configuration downloaded", "success");
  });
  document.getElementById("exportSourceBtn2").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true; const original = btn.textContent; btn.textContent = "Packaging…";
    try{
      const count = await exportLauncherSourceZip(project);
      toast("Launcher source exported" + (count ? " with " + count + " asset(s)" : ""), "success");
    }catch(err){ toast("Couldn't build the ZIP: " + err.message, "error"); }
    finally{ btn.disabled = false; btn.textContent = original; }
  });
  document.getElementById("downloadFullBtn").addEventListener("click", () => {
    downloadJson(fullExportConfig(project), slugify(project.name) + ".project.json");
    toast("Project backup downloaded", "success");
  });
  document.getElementById("copyFullBtn").addEventListener("click", async () => {
    try{ await navigator.clipboard.writeText(JSON.stringify(fullExportConfig(project), null, 2)); toast("Project JSON copied", "success"); }
    catch(e){ toast("Couldn't access clipboard", "error"); }
  });
}

  <div class="settings-section-label">Appearance</div>
  <div class="card">
    <div class="switch-row">
      <div><div class="label">Dark mode</div><div class="desc">Switch between dark and light interface.</div></div>
      <label class="switch"><input type="checkbox" id="setDark" ${s.theme==='dark'?'checked':''}><span class="track"></span></label>
    </div>
    <div class="switch-row">
      <div><div class="label">Compact mode</div><div class="desc">Reduce padding and font size for denser screens.</div></div>

  <div class="settings-section-label">Behavior</div>

    <div class="switch-row">
      <div><div class="label">Autosave project changes</div><div class="desc">Fields save to localStorage as you type.</div></div>
      <label class="switch"><input type="checkbox" id="setAutosave" ${s.autosave?'checked':''}><span class="track"></span></label>
    </div>
  </div>

  <div class="settings-section-label">New project defaults</div>
  <div class="card">
    <div class="switch-row">
      <div><div class="label">Enable Discord / support button by default</div><div class="desc">New launcher projects will start with this preference.</div></div>

    </div>

      <label>Default Discord / support URL</label>

  <div class="card">
    <p>All ${state.projects.length} project(s) are stored only in this browser's localStorage — nothing leaves your device unless you export it.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" id="exportAllSettingsBtn">Export all projects</button>
      <button class="btn btn-outline btn-sm" id="importSettingsBtn">Import project JSON</button>
    </div>
  </div>

  <div class="settings-section-label" style="color:var(--danger);">Danger zone</div>
  <div class="card" style="border-color:rgba(232,91,78,.35);">
    <div class="card-header"><div><div class="card-title" style="color:var(--danger);">Reset local projects</div><div class="card-desc">Permanently deletes every project stored in this browser. This cannot be undone — export a backup first.</div></div></div>
    <button class="btn btn-danger btn-sm" id="resetAllBtn">Reset local projects</button>
  </div>

}
function bindSettingsEvents(){
  const s = state.settings;
  document.getElementById("setDark").addEventListener("change", (e) => { s.theme = e.target.checked ? "dark":"light"; saveSettings(s); render(); });
  document.getElementById("setCompact").addEventListener("change", (e) => { s.compact = e.target.checked; saveSettings(s); render(); });
  document.getElementById("setAnim").addEventListener("change", (e) => { s.animations = e.target.checked; saveSettings(s); render(); });
  document.getElementById("setAutosave").addEventListener("change", (e) => { s.autosave = e.target.checked; saveSettings(s); toast("Autosave " + (s.autosave?"enabled":"disabled"), "info"); });
  document.getElementById("setDiscordEnabled").addEventListener("change", (e) => { s.discordEnabled = e.target.checked; saveSettings(s); });
  document.getElementById("setDiscordUrl").addEventListener("change", (e) => { s.discordUrl = e.target.value.trim(); saveSettings(s); });
  document.querySelectorAll("[data-accent]").forEach(el => {
    el.addEventListener("click", () => { s.accent = el.getAttribute("data-accent"); saveSettings(s); render(); toast("Accent updated", "success"); });
  });
  document.getElementById("exportAllSettingsBtn").addEventListener("click", () => { downloadJson(state.projects, "vynixforge-projects.json"); toast("Exported all projects", "success"); });
  document.getElementById("importSettingsBtn").addEventListener("click", openImportModal);
  document.getElementById("resetAllBtn").addEventListener("click", () => {
    openModal({
      title:"Reset local projects",
      bodyHtml:`<p>This permanently deletes <b>all ${state.projects.length} project(s)</b> stored in this browser. Export a backup first if you might need them.</p>`,
      actions:[
        {id:"cancel", label:"Cancel", cls:"btn-ghost", onClick:closeModal},
        {id:"reset", label:"Delete everything", cls:"btn-danger", onClick:() => {
          state.projects = []; persistProjects(); closeModal(); toast("All local projects deleted", "info"); go("#/dashboard");
        }}
      ]
    });
  });
}

/* ===================== ABOUT ===================== */
function renderAbout(){
  return `
  <div class="about-hero">
    <div class="brand-mark" style="margin-inline:auto;"><svg viewBox="0 0 20 20" fill="#1a0e05"><path d="M10 2l1.6 3.3L15 6l-2.4 2.6L13 12l-3-1.7L7 12l.4-3.4L5 6l3.4-.7z"/></svg></div>
    <h1>VynixForge</h1>
    <p style="max-width:520px;margin:8px auto 0;">Vynix Studio's web-based Minecraft Launcher Builder.</p>
  </div>
  <div class="card">
    <div class="card-header"><div class="card-title">What VynixForge is</div></div>
    <p>VynixForge helps creators configure and customize their own Minecraft launcher projects — from launcher type and Minecraft version, through mods, resource packs and shaders (for Modded launchers), to full visual branding — and preview the result before requesting a build.</p>
    <p>Every project is a structured configuration: it can be edited, duplicated, exported as JSON or a real launcher source project, and eventually handed to a real build service to produce a Windows <code>.exe</code>.</p>
    <div class="build-log" style="font-size:11.5px;line-height:1.9;">
      <div class="ln">VynixForge</div>
      <div class="ln">↓ Create Launcher Project</div>
      <div class="ln">↓ Choose Launcher Type — Vanilla or Modded (+ Mod Loader)</div>

/* ===================== INIT ===================== */
function seedIfEmpty(){
  // No fake/demo project data is injected — first-run shows a real empty state.
}
let lastErrorToastAt = 0;
window.addEventListener("error", (e) => {
  console.error("VynixForge error:", e.error || e.message);
  const now = Date.now();
  if(now - lastErrorToastAt > 6000){
    lastErrorToastAt = now;
    toast("Something went wrong. Your data is safe — check the console for details.", "error");
  }
});
window.addEventListener("unhandledrejection", (e) => {
  console.error("VynixForge unhandled rejection:", e.reason);
});
document.addEventListener("DOMContentLoaded", () => {
  seedIfEmpty();
  applySettingsToDom();
  bindModalEscapeOnce();
  render();
});
// In case the script runs after DOMContentLoaded already fired
if(document.readyState === "complete" || document.readyState === "interactive"){
  seedIfEmpty();
  applySettingsToDom();
  bindModalEscapeOnce();
  render();
}
</script>
</body>
