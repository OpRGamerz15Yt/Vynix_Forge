services:
  - type: web
    name: vynix-forge
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: vynix-forge-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: APP_URL
        value: https://vynix-forge.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_USER_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://vynix-forge.onrender.com/auth/github/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://vynix-forge.onrender.com/auth/google/callback
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_DEV
        sync: false
      - key: STRIPE_PRICE_ID_PRO_BDT
        sync: false
      - key: STRIPE_PRICE_ID_DEV_BDT
        sync: false